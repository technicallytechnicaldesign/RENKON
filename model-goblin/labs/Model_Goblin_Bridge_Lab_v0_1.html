<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Model Goblin AA01 Bridge Lab v0.1</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c1117;color:#eaf3f6;font:13px Segoe UI,Arial,sans-serif}
    #view{position:absolute;inset:0}#panel{position:fixed;left:16px;top:16px;z-index:3;width:330px;max-height:calc(100vh - 32px);overflow:auto;padding:14px;border:1px solid #2e3b47;border-radius:13px;background:rgba(17,24,33,.92)}
    h1{margin:0 0 5px;font-size:18px}p{margin:0 0 12px;color:#96a7b5;line-height:1.4}.drop{display:block;margin:8px 0;padding:15px;border:1px dashed #425361;border-radius:9px;text-align:center;cursor:pointer}.drop:hover{border-color:#75efb3}
    input{display:none}button,select,input[type=range]{width:100%;margin-top:8px}button,select{min-height:35px;border:1px solid #334453;border-radius:8px;background:#16212b;color:#eef5f7}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}#status{margin-top:10px;padding:9px;border-radius:8px;background:#0d151c;color:#94a8b6;white-space:pre-wrap}
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"}}</script>
</head>
<body>
  <div id="view"></div>
  <aside id="panel"><h1>AA01 Bridge Lab</h1><p>Historical matrix-forensics viewer. AA03 is the recommended route.</p>
    <label class="drop">Drop/click GLB<input id="glb" type="file" accept=".glb"></label>
    <label class="drop">Drop/click .goblinanim.json<input id="anim" type="file" accept=".json"></label>
    <div class="row"><select id="layout"><option value="column">Column-major</option><option value="row">Row-major</option></select><select id="compose"><option value="direct">Direct matrix</option><option value="delta">Delta x base</option></select></div>
    <button id="play">Play</button><input id="time" type="range" min="0" max="1" step=".001" value="0"><div id="status">Load a GLB and AA01 JSON.</div>
  </aside>
  <script type="module">
    import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{DRACOLoader}from'three/addons/loaders/DRACOLoader.js';
    const $=id=>document.getElementById(id),scene=new THREE.Scene();scene.background=new THREE.Color(0x0c1117);const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.001,1e6);camera.position.set(3,2,5);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));$('view').appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x20242a,2.5));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(5,8,5);scene.add(light);
    let root=null,data=null,playing=false,current=0,last=performance.now(),bases=new Map();const loader=new GLTFLoader(),draco=new DRACOLoader();draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/libs/draco/');loader.setDRACOLoader(draco);
    function norm(v){return String(v||'').toLowerCase().replace(/[^a-z0-9]/g,'')}function target(track){let found=null;root?.traverse(o=>{if(!found&&norm(o.name)===norm(track.target?.name))found=o});return found}function sample(samples,t){if(!samples?.length)return null;if(t<=samples[0].time)return samples[0];if(t>=samples.at(-1).time)return samples.at(-1);let i=1;while(i<samples.length&&samples[i].time<t)i++;return samples[i-1]}
    function apply(t){for(const track of data?.nodes||[]){const object=target(track);if(!object)continue;const s=sample(track.samples,t),values=s?.worldMatrix||s?.localMatrix;if(!values||values.length<16)continue;let m=new THREE.Matrix4();if($('layout').value==='column')m.fromArray(values);else m.set(...values);if($('compose').value==='delta'){const base=bases.get(object.uuid)||object.matrix.clone();m.premultiply(base)}m.decompose(object.position,object.quaternion,object.scale);object.visible=!s.hidden}current=t;$('time').value=data?.duration?current/data.duration:0}
    $('glb').onchange=async()=>{const f=$('glb').files[0];if(!f)return;loader.parse(await f.arrayBuffer(),'',g=>{if(root)scene.remove(root);root=g.scene;scene.add(root);root.traverse(o=>bases.set(o.uuid,o.matrix.clone()));const b=new THREE.Box3().setFromObject(root),c=b.getCenter(new THREE.Vector3()),s=Math.max(...b.getSize(new THREE.Vector3()).toArray());controls.target.copy(c);camera.position.copy(c).add(new THREE.Vector3(s,s*.6,s*1.4));camera.near=Math.max(s/1e4,.0001);camera.far=s*1e3;camera.updateProjectionMatrix();$('status').textContent='GLB loaded.'},e=>$('status').textContent=e.message)};
    $('anim').onchange=async()=>{data=JSON.parse(await $('anim').files[0].text());$('status').textContent=`AA01 tracks: ${data.nodes?.length||0}\nDuration: ${data.duration||0}s`;apply(0)};$('play').onclick=()=>{playing=!playing;last=performance.now();$('play').textContent=playing?'Pause':'Play'};$('time').oninput=()=>{playing=false;$('play').textContent='Play';apply(Number($('time').value)*(data?.duration||0))};
    function loop(now){requestAnimationFrame(loop);if(playing&&data?.duration){current+=(now-last)/1000;if(current>data.duration)current%=data.duration;apply(current)}last=now;controls.update();renderer.render(scene,camera)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
  </script>
</body>
</html>
