<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Parametric Assets</title>
<link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap"></noscript>
<link rel="stylesheet" href="../../assets/generator-ui.css">
<style>
  :root {
    --bg: #0C141D;
    --panel-bg: #14202C;
    --panel-bg-raised: #182635;
    --line: #22303E;
    --text: #ECF2F6;
    --muted: #6E7E8C;

    --c-structural: #002F67;
    --c-fluid: #4FD1D9;
    --c-accent: #F08A3C;
    --c-leader: #E8E8E8;
    --c-panel-base: #001A33;
    --c-panel: rgba(0,26,51,0.85);
    --c-label: #F5F7F8;
    --c-caution: #E0342B;

    --font-display: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "Space Mono", ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--font-display);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  button, input { font-family: inherit; }
  button { cursor: pointer; border-radius: 0; }
  button:focus-visible, input:focus-visible, a:focus-visible {
    outline: 2px solid var(--c-accent); outline-offset: 3px;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
  }

  #app-header {
    display: flex; align-items: center; gap: 20px;
    padding: 14px 28px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: var(--bg); z-index: 10;
  }
  #app-header .crumbs {
    font-family: var(--font-mono);
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    min-width: 0; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #app-header .crumbs button {
    background: none; border: none; color: var(--c-accent); font-size: 11px;
    letter-spacing: 0.08em; text-transform: uppercase; padding: 0; font-family: inherit;
  }
  #app-header .crumbs button:hover { text-decoration: underline; }
  #app-header .mark { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: 0.08em; margin-left: auto; flex: none; }
  #app-header .brand { display: flex; align-items: center; gap: 11px; color: var(--text); margin-right: 24px; flex: none; }
  #app-header .brand .mark { width: 26px; height: 26px; flex: none; color: var(--c-accent); margin-left: 0; }
  #app-header .brand .mark svg { display: block; width: 100%; height: 100%; }
  #app-header .wordmark { font-family: var(--font-display); font-size: 14px; letter-spacing: 0.28em; font-weight: 500; flex: none; }
  #app-header .wordmark b { color: var(--c-accent); font-weight: 500; }
  @media (max-width: 600px) {
    #app-header { padding: 12px 16px; gap: 12px; }
  }
  #app-main { padding: 28px; max-width: 1400px; margin: 0 auto; }

  .page-head { margin-bottom: 24px; }
  .page-head h1 {
    font-family: var(--font-display);
    font-size: 17px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text); margin: 0 0 6px 0; font-weight: 500;
  }
  .page-head p { color: var(--muted); font-size: 12px; margin: 0; max-width: 62ch; line-height: 1.6; }
  .up-link {
    font-family: var(--font-mono);
    display: inline-flex; align-items: center; gap: 5px;
    background: none; border: none; color: var(--c-accent);
    font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 0; margin-bottom: 10px;
  }
  .up-link:hover { text-decoration: underline; }
  .up-icon { font-size: 12px; line-height: 1; }

  .card-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 1px; background: var(--line); border: 1px solid var(--line);
  }
  .card {
    background: var(--panel-bg); padding: 20px; min-height: 130px;
    display: flex; flex-direction: column; gap: 10px; text-align: left;
    border: none; color: var(--text); transition: background 0.15s ease;
  }
  .card.active { cursor: pointer; }
  .card.active:hover { background: var(--panel-bg-raised); }
  .card .tag { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--c-accent); }
  .card .tag.inwork { color: var(--muted); }
  .card.planned .tag { color: var(--muted); }
  .card h2 { font-family: var(--font-display); font-size: 13px; margin: 0; font-weight: 500; }
  .card p { font-size: 12px; color: var(--muted); margin: 0; line-height: 1.6; }
  .card.planned { opacity: 0.55; border: 1px dashed var(--line); background: transparent; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 4px; }
  .card-tag {
    font-family: var(--font-mono);
    font-size: 9.5px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--muted); border: 1px solid var(--line); padding: 2px 7px;
  }
  .card.subtype-card { padding-bottom: 12px; }
  .mini-stage {
    margin-top: 4px; background: var(--stage-bg, #060a10); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    min-height: 90px; padding: 8px; overflow: hidden;
  }
  .mini-stage svg { max-width: 100%; height: auto; display: block; }

  /* Collapsed-by-default (Lens 4B.1 — the one intentional exception to
     "everything defaults open" in this pass): a rarely-used advanced panel
     that used to dominate every customize screen. */
  .palette-details {
    background: var(--panel-bg); border: 1px solid var(--line); margin-bottom: 16px;
  }
  .palette-details > summary {
    font-family: var(--font-mono);
    padding: 14px 18px; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text); font-weight: 500; cursor: pointer; list-style: none;
  }
  .palette-details > summary::-webkit-details-marker { display: none; }
  .palette-details > summary .chev { display: inline-block; color: var(--c-accent); margin-right: 4px; transition: transform 0.15s ease; }
  .palette-details[open] > summary .chev { transform: rotate(90deg); }
  .palette-panel {
    display: flex; flex-wrap: wrap; gap: 18px; padding: 4px 18px 16px;
  }
  .palette-role { display: flex; align-items: center; gap: 8px; }
  .palette-role label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .palette-role input[type=color] { width: 28px; height: 28px; padding: 0; border: 1px solid var(--line); background: none; }
  .palette-actions { display: flex; gap: 8px; align-items: center; margin-left: auto; }
  .save-status { font-size: 10px; color: var(--muted); min-width: 90px; }

  .param-panel {
    display: flex; flex-wrap: wrap; gap: 18px; align-items: center;
    padding: 14px 18px; background: var(--panel-bg); border: 1px solid var(--line); margin-bottom: 16px;
  }
  .param-row { display: flex; align-items: center; gap: 8px; }
  .param-row label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .param-row input[type=range] { width: 100px; accent-color: var(--c-accent); }
  .param-row input[type=checkbox] { accent-color: var(--c-accent); width: 16px; height: 16px; }
  .param-value { font-family: var(--font-mono); font-size: 10px; color: var(--c-fluid); min-width: 54px; text-align: right; font-variant-numeric: tabular-nums; }
  .param-panel .btn { margin-left: auto; }
  .param-hint { flex-basis: 100%; font-size: 12px; color: var(--muted); }

  /* Texture tool control panel: ordered, labeled sections stacked vertically
     (Lens 4A reorg) — each .control-section holds a .section-label header
     (or <summary class="section-label"> for the two <details open> blocks)
     plus a .texture-sliders row-wrap body. */
  .texture-controls { align-items: stretch; flex-direction: column; flex-wrap: nowrap; gap: 22px; }
  .control-section { width: 100%; }
  .texture-sliders { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; }
  .pattern-groups { display: flex; flex-wrap: wrap; gap: 18px; }
  .pattern-group { display: flex; flex-direction: column; gap: 6px; }
  .pattern-group-label {
    font-family: var(--font-mono);
    font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
  }
  .pattern-select { display: flex; flex-wrap: wrap; gap: 6px; }
  .pattern-btn { display: inline-flex; align-items: center; gap: 8px; }
  .pattern-btn .ic svg { width: 16px; height: 16px; display: block; flex: none; }
  .pattern-filter-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 6px; }
  .filter-chip {
    font-family: var(--font-mono);
    display: flex; align-items: center; gap: 6px; padding: 6px 10px;
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase;
    cursor: pointer;
  }
  .filter-chip .ic svg { width: 14px; height: 14px; display: block; flex: none; }
  .filter-chip:hover { border-color: var(--c-accent); color: var(--c-accent); }
  .filter-chip.active { border-color: var(--c-accent); color: var(--c-accent); background: var(--panel-bg-raised); }

  /* Overlay-kit landing view: FN / VIBE tag filter bar. Reuses
     .pattern-group-label + .pattern-filter-row + .filter-chip verbatim —
     same chip grammar as the texture tool's pattern filter, just
     multi-select (OR within an axis, AND across axes) instead of
     single-select, and hash-driven instead of local DOM state. */
  .tag-filter-bar { display: flex; flex-direction: column; gap: 12px; margin-bottom: 22px; }
  .tag-filter-axis { display: flex; flex-direction: column; gap: 6px; }
  .tag.subtype-cat-tag { color: var(--muted); }
  .tag-filter-empty {
    font-family: var(--font-mono);
    padding: 40px 20px; text-align: center; color: var(--muted);
    font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase;
    border: 1px dashed var(--line);
  }
  .section-label {
    font-family: var(--font-mono);
    display: block; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text); font-weight: 500; border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 4px;
  }
  summary.section-label { cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; }
  summary.section-label:hover { color: var(--c-accent); }
  summary.section-label::-webkit-details-marker { display: none; }
  summary.section-label .chev { display: none; } /* replaced by +/- marker to match hydroform */
  summary.section-label::after { content: "+"; color: var(--muted); font-size: 15px; font-weight: 400; }
  details[open] > summary.section-label::after { content: "\2013"; }
  details.control-section > .texture-sliders { padding-top: 14px; }
  .export-section {
    padding: 14px 18px; background: var(--panel-bg); border: 1px solid var(--line);
    margin-bottom: 16px; display: flex; flex-direction: column; gap: 12px;
  }
  .preview-caption { flex-basis: 100%; font-size: 12px; color: var(--muted); text-align: center; margin-top: 2px; }
  .canvas-row { display: flex; flex-wrap: wrap; gap: 1px; background: var(--line); border: 1px solid var(--line); margin-bottom: 16px; }
  .canvas-panel { background: var(--panel-bg); padding: 16px; flex: 1 1 260px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .canvas-panel-title { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); align-self: flex-start; }
  .canvas-panel canvas { width: 100%; max-width: 320px; height: auto; background: var(--stage-bg, #060a10); border: 1px solid var(--line); }

  .text-field-wrap {
    display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px;
    padding: 14px 18px; background: var(--panel-bg); border: 1px solid var(--line); max-width: 420px;
  }
  .text-field-wrap label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .text-field-wrap input[type=text] {
    background: var(--panel-bg-raised, #060a10); border: 1px solid var(--line); color: var(--text);
    padding: 8px 10px; font-size: 13px;
  }
  .text-field-wrap input[type=text]:focus-visible { border-color: var(--c-accent); }
  .text-field-wrap .hint { font-size: 10px; color: var(--muted); }

  .large-stage {
    background: var(--stage-bg, #060a10); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    min-height: 140px; padding: 18px; margin-bottom: 14px;
  }
  .large-stage svg { max-width: min(260px, 100%); max-height: 180px; width: auto; height: auto; display: block; }
  /* transparent-export preview: a theme-aware checkerboard behind the overlay */
  .large-stage.stage-transparent {
    background-color: var(--panel-bg);
    background-image:
      linear-gradient(45deg, var(--line) 25%, transparent 25%, transparent 75%, var(--line) 75%),
      linear-gradient(45deg, var(--line) 25%, transparent 25%, transparent 75%, var(--line) 75%);
    background-size: 16px 16px; background-position: 0 0, 8px 8px;
  }

  .bg-control { margin-bottom: 14px; }
  .bg-control-label {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 8px;
  }
  .bg-swatches { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .bg-sw {
    width: 26px; height: 26px; border: 1px solid var(--line); cursor: pointer;
    padding: 0; border-radius: 0; position: relative; background: transparent;
  }
  .bg-sw:hover { border-color: var(--c-accent); }
  .bg-sw.on { outline: 2px solid var(--c-accent); outline-offset: 1px; }
  .bg-sw.sw-none {
    background-color: var(--panel-bg);
    background-image:
      linear-gradient(45deg, var(--line) 25%, transparent 25%, transparent 75%, var(--line) 75%),
      linear-gradient(45deg, var(--line) 25%, transparent 25%, transparent 75%, var(--line) 75%);
    background-size: 10px 10px; background-position: 0 0, 5px 5px;
  }
  .bg-sw.sw-none::after {
    content: ""; position: absolute; left: -1px; top: 50%; width: 34px; height: 1px;
    background: var(--c-caution); transform: rotate(-45deg); transform-origin: center;
  }
  .bg-custom { display: inline-flex; align-items: center; margin-left: 2px; }
  .bg-custom input[type=color] {
    width: 30px; height: 26px; border: 1px solid var(--line); padding: 0;
    background: transparent; cursor: pointer;
  }
  .bg-control-note {
    font-family: var(--font-mono); font-size: 9.5px; color: var(--muted);
    margin-top: 8px; line-height: 1.5; max-width: 52ch;
  }

  /* Surprise-me variations grid */
  .var-actions { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
  .var-hint { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.04em; color: var(--muted); }
  .var-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  @media (max-width: 640px) { .var-grid { grid-template-columns: repeat(2, 1fr); } }
  .var-tile {
    background: var(--stage-bg, #060a10); border: 1px solid var(--line); border-radius: 0;
    cursor: pointer; padding: 10px; aspect-ratio: 4 / 3; display: flex;
    align-items: center; justify-content: center; overflow: hidden; transition: border-color 0.12s ease;
  }
  .var-tile:hover, .var-tile:focus-visible { border-color: var(--c-accent); outline: none; }
  .var-stage { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
  .var-stage svg { max-width: 100%; max-height: 100%; width: auto; height: auto; display: block; }

  .btn {
    font-family: var(--font-mono);
    background: transparent; border: 1px solid var(--line); color: var(--text);
    font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; padding: 8px 14px;
  }
  .btn:hover { border-color: var(--c-accent); color: var(--c-accent); }
  .btn.primary { border-color: var(--c-accent); color: var(--c-accent); }
  .btn.primary:hover { background: var(--c-accent); color: var(--bg); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn:disabled:hover { border-color: var(--line); color: var(--text); }
  .cell-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .status-line { font-size: 12px; color: var(--muted); min-height: 14px; margin-top: 8px; }

  footer.note {
    margin-top: 26px; font-size: 12px; color: var(--muted); line-height: 1.6;
    border-top: 1px solid var(--line); padding-top: 14px; max-width: 74ch;
  }
  footer.note ul.note-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  footer.note ul.note-list li { padding-left: 18px; position: relative; }
  footer.note ul.note-list li::before {
    content: "\25B8"; position: absolute; left: 0; top: 0; color: var(--c-accent);
  }
  footer.note .k { color: var(--text); }
  footer.note .k::after { content: " \2192"; color: var(--muted); }
</style>
<script src="../../assets/theme.js"></script>
<script src="../../assets/reveal.js"></script>

<script src="../../assets/overlay-engine.js"></script>
<script>
(function () {
  "use strict";

  /* =========================================================
     PALETTE
     ========================================================= */
  const PALETTE_ROLES = [
    { key: "structural", cssVar: "--c-structural", label: "Structural", hex: "#002F67" },
    { key: "fluid",      cssVar: "--c-fluid",      label: "Fluid",      hex: "#4FD1D9" },
    { key: "accent",     cssVar: "--c-accent",     label: "Accent",     hex: "#F08A3C" },
    { key: "leader",     cssVar: "--c-leader",     label: "Leader",     hex: "#E8E8E8" },
    { key: "panel",      cssVar: "--c-panel-base", label: "Panel BG",   hex: "#001A33" },
    { key: "label",      cssVar: "--c-label",      label: "Label Text", hex: "#F5F7F8" },
    { key: "caution",    cssVar: "--c-caution",    label: "Caution",    hex: "#E0342B" }
  ];

  function hexToRgb(hex) {
    const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    if (!m) return { r: 0, g: 0, b: 0 };
    return { r: parseInt(m[1], 16), g: parseInt(m[2], 16), b: parseInt(m[3], 16) };
  }

  function applyPaletteToDOM(palette) {
    const root = document.documentElement.style;
    PALETTE_ROLES.forEach(role => root.setProperty(role.cssVar, palette[role.key]));
    const rgb = hexToRgb(palette.panel);
    root.setProperty("--c-panel", `rgba(${rgb.r},${rgb.g},${rgb.b},0.85)`);
  }

  function defaultPalette() {
    const p = {};
    PALETTE_ROLES.forEach(r => p[r.key] = r.hex);
    return p;
  }

  let palette = defaultPalette();
  // Reload a persisted palette on mount (Lens 4B.2 — Save/Load Palette use
  // localStorage, same reasoning as the texture tool's preset persistence
  // below: no window.storage global exists in a plain browser). Falls back
  // silently to the built-in default if nothing was saved yet.
  try {
    const savedPalette = localStorage.getItem("palette:default");
    if (savedPalette) palette = Object.assign(defaultPalette(), JSON.parse(savedPalette));
  } catch (e) {}

  /* =========================================================
     PER-ASSET LIVE PARAMS (opacity / thickness / speed / roundness)
     All four are wired through CSS custom properties set inline on
     each asset's own <svg> root (--t-mult, --s-mult, --r-mult, plus
     plain `opacity`), so adjusting a slider never has to re-render
     the markup or restart an animation — except SMIL speed, which
     has no CSS equivalent for its `dur` attribute and is re-baked
     into the template on change instead.
     ========================================================= */
  const DEFAULT_PARAMS = { opacity: 1, thickness: 1, speed: 1, roundness: 0, size: 1, rotation: 0 };
  // Per-asset look, persisted across reloads so a tuned overlay survives a
  // refresh. (Colours live in the palette store; the export bg in overlay:bg.)
  const assetParams = (function () {
    try { return JSON.parse(localStorage.getItem("overlay:params")) || {}; } catch (e) { return {}; }
  })();
  let paramsSaveTimer = null;
  function persistParams() {
    if (paramsSaveTimer) return; // debounce a burst of slider input into one write
    paramsSaveTimer = setTimeout(function () {
      paramsSaveTimer = null;
      try { localStorage.setItem("overlay:params", JSON.stringify(assetParams)); } catch (e) {}
    }, 300);
  }
  function getParams(asset) {
    if (!assetParams[asset.id]) {
      assetParams[asset.id] = Object.assign({}, DEFAULT_PARAMS, asset.paramPreset || {});
    } else {
      // backfill any keys missing from an older persisted look, in place
      for (var k in DEFAULT_PARAMS) if (assetParams[asset.id][k] === undefined) assetParams[asset.id][k] = DEFAULT_PARAMS[k];
    }
    return assetParams[asset.id];
  }
  // Wrap all of an asset's SVG content in one <g class="pk-xform"> so Size and
  // Rotation can be applied — and baked into exports — without editing each
  // asset's markup. defs/style ride along harmlessly (transforms don't affect
  // non-rendering nodes, and id/class references resolve document-wide).
  const SVGNS = "http://www.w3.org/2000/svg";
  function ensureXformGroup(svgEl) {
    let g = svgEl.querySelector(":scope > g.pk-xform");
    if (!g) {
      g = document.createElementNS(SVGNS, "g");
      g.setAttribute("class", "pk-xform");
      while (svgEl.firstChild) g.appendChild(svgEl.firstChild);
      svgEl.appendChild(g);
    }
    return g;
  }
  function applyLiveParams(asset, stage) {
    const svgEl = stage.querySelector("svg");
    if (!svgEl) return;
    const p = getParams(asset);
    svgEl.style.opacity = p.opacity;
    svgEl.style.setProperty("--t-mult", p.thickness);
    if (asset.engine === "css") svgEl.style.setProperty("--s-mult", p.speed);
    if (asset.roundable) svgEl.style.setProperty("--r-mult", p.roundness + "px");
    // size + rotation via the transform wrapper, around the viewBox centre
    const g = ensureXformGroup(svgEl);
    const size = p.size == null ? 1 : p.size;
    const rot = p.rotation || 0;
    if (size === 1 && rot === 0) {
      g.removeAttribute("transform");
    } else {
      const { w, h } = viewBoxSize(svgEl);
      const cx = w / 2, cy = h / 2;
      g.setAttribute("transform",
        "translate(" + cx + " " + cy + ") rotate(" + rot + ") scale(" + size + ") translate(" + (-cx) + " " + (-cy) + ")");
    }
    persistParams(); // every mutation path renders through here
  }

  /* ---- shareable "look" links -------------------------------------------
     Encode the current asset's params + export bg + palette into the hash so a
     tuned overlay is a copy-pasteable URL. Parsed back in mountOverlayKit. */
  function categorySlugFor(asset) {
    const c = CATEGORIES.find(function (x) { return x.label === asset.category; });
    return c ? c.slug : "";
  }
  function encodeLook(asset) {
    const p = getParams(asset);
    const parts = [
      "sz=" + Math.round(p.size * 100),
      "rot=" + Math.round(p.rotation),
      "op=" + Math.round(p.opacity * 100),
      "sp=" + Math.round(p.speed * 100),
      "th=" + Math.round(p.thickness * 100)
    ];
    if (asset.roundable) parts.push("rn=" + Math.round(p.roundness));
    parts.push("bg=" + (overlayBg === "transparent" ? "t" : overlayBg.replace("#", "")));
    parts.push("pal=" + PALETTE_ROLES.map(function (r) { return palette[r.key].replace("#", ""); }).join("-"));
    return parts.join("&");
  }
  function applyLook(asset, q) {
    const p = getParams(asset);
    // parseHashQuery yields arrays (built for multi-select filters) — read the
    // first value of each key.
    const val = function (k) { const v = q[k]; return Array.isArray(v) ? v[0] : v; };
    const has = function (k) { return val(k) != null && val(k) !== ""; };
    const num = function (k, d) { const v = parseFloat(val(k)); return isFinite(v) ? v : d; };
    if (has("sz")) p.size = num("sz", 100) / 100;
    if (has("rot")) p.rotation = num("rot", 0);
    if (has("op")) p.opacity = num("op", 100) / 100;
    if (has("sp")) p.speed = num("sp", 100) / 100;
    if (has("th")) p.thickness = num("th", 100) / 100;
    if (has("rn") && asset.roundable) p.roundness = num("rn", 0);
    if (has("bg")) { const bg = String(val("bg")); setOverlayBg(bg === "t" ? "transparent" : ("#" + bg.replace("#", ""))); }
    if (has("pal")) {
      const hexes = String(val("pal")).split("-");
      PALETTE_ROLES.forEach(function (r, i) { if (hexes[i]) palette[r.key] = "#" + hexes[i].replace("#", ""); });
      applyPaletteToDOM(palette);
    }
  }
  function shareURL(asset) {
    return location.href.split("#")[0] + "#overlay-kit/" + categorySlugFor(asset) + "/" + asset.id + "?" + encodeLook(asset);
  }
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);

      } catch (e) { rej(e); }
    });
  }

  function tagLabel(tag) {

  /* =========================================================

     ========================================================= */
  function applyText(asset, stage) {
    if (!asset.hasText) return;

    if (slot) slot.textContent = customText[asset.id];
  }

  function renderAssetInto(stage, asset) {
    const rid = nextRid();

  /* ---- export background (shared across every overlay + every export) ----
     Overlays are transparent by nature; WebM can't hold alpha, so let the user
     pick a solid background that bakes into every export — most usefully a key
     colour they can chroma out later. "transparent" keeps PNG alpha. */
  let overlayBg = (function () {
    try { return localStorage.getItem("overlay:bg") || "transparent"; } catch (e) { return "transparent"; }
  })();
  function setOverlayBg(v) {
    overlayBg = v;
    try { localStorage.setItem("overlay:bg", v); } catch (e) {}
  }
  // live preview: colour behind the stage, or a checkerboard when transparent
  function applyStageBg(stage) {
    if (!stage) return;
    if (overlayBg === "transparent") {
      stage.style.background = "";
      stage.classList.add("stage-transparent");
    } else {
      stage.classList.remove("stage-transparent");
      stage.style.background = overlayBg;
    }
  }
  // bake into a capture canvas before the overlay frame is drawn on top
  function paintExportBg(ctx, cw, ch) {
    if (overlayBg && overlayBg !== "transparent") {
      ctx.fillStyle = overlayBg;
      ctx.fillRect(0, 0, cw, ch);
    }
  }

  function buildBackgroundControl(stage) {
    const wrap = document.createElement("div");
    wrap.className = "bg-control";
    const label = document.createElement("div");
    label.className = "bg-control-label";
    label.textContent = "Export background";
    wrap.appendChild(label);

    const row = document.createElement("div");
    row.className = "bg-swatches";

    const SWATCHES = [
      { key: "transparent", label: "None (transparent)" },
      { key: "#000000", label: "Black" },
      { key: "#FFFFFF", label: "White" },
      { key: "#00E676", label: "Key green" },
      { key: "#2962FF", label: "Key blue" },
      { key: "#FF00FF", label: "Key magenta" }
    ];

    const custom = document.createElement("input");
    custom.type = "color";
    custom.value = /^#/.test(overlayBg) ? overlayBg : "#00E676";

    function reflect() {
      row.querySelectorAll(".bg-sw").forEach(b => b.classList.toggle("on", b.dataset.key === overlayBg));
      if (/^#/.test(overlayBg)) custom.value = overlayBg;
      applyStageBg(stage);
    }

    SWATCHES.forEach(s => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "bg-sw" + (s.key === "transparent" ? " sw-none" : "");
      b.dataset.key = s.key;

  // Hash query parsing: the router historically split only on "/". Filter
  // state rides a "?key=val,val&key2=val" query string glued onto the FIRST
  // segment (e.g. "#overlay-kit?fn=flow&vibe=dramatic" or, one level deeper,
  // "#overlay-kit/fluid-flow?..." if that's ever needed) — split it off
  // before matching against TOOLS/CATEGORIES/ASSETS ids, which never
  // contain "?". Multi-select per axis is comma-joined (OR within an axis).
  function parseHashQuery(raw) {
    const query = {};
    if (!raw) return query;
    raw.split("&").forEach(pair => {
      if (!pair) return;
      const eq = pair.indexOf("=");
      const key = eq === -1 ? pair : pair.slice(0, eq);
      const val = eq === -1 ? "" : decodeURIComponent(pair.slice(eq + 1));
      query[key] = val ? val.split(",").filter(Boolean) : [];
    });
    return query;
  }

  function navigate() {
    const rawParts = location.hash.replace(/^#/, "").split("/").filter(Boolean);
    const main = document.getElementById("app-main");
    if (rawParts.length === 0) { mountHome(main); return; }
    const qIdx = rawParts[0].indexOf("?");
    const toolId = qIdx === -1 ? rawParts[0] : rawParts[0].slice(0, qIdx);
    const query = qIdx === -1 ? {} : parseHashQuery(rawParts[0].slice(qIdx + 1));
    const tool = TOOLS.find(t => t.id === toolId);
    if (!tool) { mountHome(main); return; }
    main.innerHTML = "";
    tool.mount(main, rawParts.slice(1), query);
  }
  window.addEventListener("hashchange", navigate);

  /* =========================================================
     OVERLAY KIT TOOL — type -> subtype -> customize
     ========================================================= */
  function mountOverlayKit(main, subpath, query) {
    const [catSlug, assetSeg] = subpath;
    if (!catSlug) { renderTypeGrid(main, query || {}); return; }
    const category = CATEGORIES.find(c => c.slug === catSlug);
    if (!category) { location.hash = "#overlay-kit"; return; }
    if (!assetSeg) { renderSubtypeGrid(main, category); return; }
    // A shared-look link carries the params in a query on the asset segment:
    //   #overlay-kit/fluid-flow/flow-straight?sz=120&rot=15&bg=00E676&pal=...
    let assetId = assetSeg, look = null;
    const qi = assetSeg.indexOf("?");
    if (qi !== -1) { assetId = assetSeg.slice(0, qi); look = parseHashQuery(assetSeg.slice(qi + 1)); }
    const asset = ASSETS.find(a => a.id === assetId && a.category === category.label);
    if (!asset) { location.hash = "#overlay-kit/" + category.slug; return; }
    if (look) applyLook(asset, look);
    renderCustomize(main, category, asset);
  }

  // Builds the "#overlay-kit?fn=..&vibe=.." hash for a given filter state
  // (empty axes are omitted entirely, so the plain "#overlay-kit" landing
  // hash is unchanged when no chip is active).
  function buildOverlayKitHash(fn, vibe) {
    const params = [];
    if (fn && fn.length) params.push("fn=" + fn.join(","));
    if (vibe && vibe.length) params.push("vibe=" + vibe.join(","));
    return "#overlay-kit" + (params.length ? "?" + params.join("&") : "");
  }

  function toggledTag(list, tag) {
    return list.includes(tag) ? list.filter(t => t !== tag) : list.concat([tag]);
  }

  // FN/VIBE chip bar — two labeled rows, one chip per taxonomy tag, multi-
  // select. Same visual grammar as the texture tool's pattern-group filter
  // chips (.filter-chip / .filter-chip.active), just multi-select instead
  // of single-select, and driving the URL hash instead of local DOM state.
  function buildTagFilterBar(query) {
    const activeFn = query.fn || [];
    const activeVibe = query.vibe || [];
    const bar = document.createElement("div");
    bar.className = "tag-filter-bar";

    TAG_AXES.forEach(axis => {
      const activeList = axis.key === "fn" ? activeFn : activeVibe;
      const axisWrap = document.createElement("div");
      axisWrap.className = "tag-filter-axis";
      const label = document.createElement("div");
      label.className = "pattern-group-label";
      label.textContent = axis.label.toUpperCase();
      axisWrap.appendChild(label);

      const chipRow = document.createElement("div");
      chipRow.className = "pattern-filter-row";
      axis.tags.forEach(tag => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "filter-chip" + (activeList.includes(tag) ? " active" : "");
        chip.innerHTML = '<span class="ic" aria-hidden="true">' + TAG_ICONS[tag] + "</span><span>" + tagLabel(tag) + "</span>";
        chip.addEventListener("click", () => {
          const nextFn = axis.key === "fn" ? toggledTag(activeFn, tag) : activeFn;
          const nextVibe = axis.key === "vibe" ? toggledTag(activeVibe, tag) : activeVibe;
          location.hash = buildOverlayKitHash(nextFn, nextVibe);
        });
        chipRow.appendChild(chip);
      });
      axisWrap.appendChild(chipRow);
      bar.appendChild(axisWrap);
    });

    return bar;
  }

  // Shared asset-card builder for both the per-category subtype grid and
  // the flat filtered grid (Task B reuses this renderer rather than
  // building a second card look). Returns the unattached {card, stage}
  // pair so callers can append-then-render in the same order the original
  // subtype grid did (SMIL/CSS assets render into a stage already in the
  // live DOM).
  function buildAssetCard(asset, opts) {
    opts = opts || {};
    const category = CATEGORIES.find(c => c.label === asset.category);
    const card = document.createElement("button");
    card.className = "card active subtype-card";
    let tag = asset.engine === "static" ? "Static" : (asset.loop ? "Loops" : "Plays once");
    const catTagHtml = opts.showCategory ? `<div class="tag subtype-cat-tag">${asset.category}</div>` : "";
    card.innerHTML = `<div class="tag">${tag}</div>${catTagHtml}<h2>${asset.name}</h2>`;
    const stage = document.createElement("div");
    stage.className = "mini-stage";
    card.appendChild(stage);
    card.addEventListener("click", () => { location.hash = "#overlay-kit/" + category.slug + "/" + asset.id; });
    return { card, stage };
  }

  function renderTypeGrid(main, query) {
    query = query || {};
    const activeFn = query.fn || [];
    const activeVibe = query.vibe || [];
    const anyActive = activeFn.length > 0 || activeVibe.length > 0;

    setCrumbs([{ label: "Overlay Asset Customizer", hash: "#overlay-kit" }]);
    main.appendChild(buildPageHead(
      "Select a Type",
      "Families of overlay. Pick one to see its variants, or filter by function and vibe below.",
      { label: "Parametric Assets", hash: "" }
    ));

    main.appendChild(buildTagFilterBar(query));

    if (anyActive) {
      // OR within an axis, AND across axes: an asset passes an axis check
      // if that axis has no active chips (untouched) or its tags intersect
      // the active set.
      const filtered = ASSETS.filter(a => {
        const tags = a.tags || { fn: [], vibe: [] };
        const fnOk = activeFn.length === 0 || tags.fn.some(t => activeFn.includes(t));
        const vibeOk = activeVibe.length === 0 || tags.vibe.some(t => activeVibe.includes(t));
        return fnOk && vibeOk;
      });

      if (filtered.length === 0) {
        const empty = document.createElement("div");
        empty.className = "tag-filter-empty";
        empty.textContent = "Nothing matches — try dropping a chip.";
        main.appendChild(empty);
        return;
      }

      const grid = document.createElement("div");
      grid.className = "card-grid";
      filtered.forEach(asset => {
        const { card, stage } = buildAssetCard(asset, { showCategory: true });
        grid.appendChild(card);
        renderAssetInto(stage, asset);
      });
      main.appendChild(grid);
      return;
    }

    const grid = document.createElement("div");
    grid.className = "card-grid";
    CATEGORIES.forEach(cat => {
      const count = ASSETS.filter(a => a.category === cat.label).length;
      const card = document.createElement("button");
      card.className = "card active";
      card.innerHTML = `<div class="tag">${count} variant${count === 1 ? "" : "s"}</div><h2>${cat.label}</h2><p>${cat.blurb}</p>`;
      card.addEventListener("click", () => { location.hash = "#overlay-kit/" + cat.slug; });
      grid.appendChild(card);
    });
    main.appendChild(grid);
  }

  function renderSubtypeGrid(main, category) {
    setCrumbs([
      { label: "Overlay Asset Customizer", hash: "#overlay-kit" },
      { label: category.label }
    ]);
    main.appendChild(buildPageHead(
      category.label,
      `${category.blurb} Pick a variant to customize and export it.`,
      { label: "Types", hash: "#overlay-kit" }
    ));

    const grid = document.createElement("div");
    grid.className = "card-grid";
    ASSETS.filter(a => a.category === category.label).forEach(asset => {
      const { card, stage } = buildAssetCard(asset);
      grid.appendChild(card);
      renderAssetInto(stage, asset);

  }

  // Curated one-tap starting points — merged over DEFAULT_PARAMS so unset keys
  // return to default. The studio-style "vibe" dropdown next to Randomize.
  const VIBES = [
    { label: "Subtle",     p: { opacity: 0.5,  thickness: 0.85, speed: 0.7, size: 0.9,  rotation: 0 } },
    { label: "Bold",       p: { opacity: 1,    thickness: 2.0,  speed: 1,   size: 1.12, rotation: 0 } },
    { label: "Fast",       p: { opacity: 0.9,  thickness: 1.1,  speed: 3.2, size: 1,    rotation: 0 } },
    { label: "Slow drift", p: { opacity: 0.8,  thickness: 1.0,  speed: 0.3, size: 1,    rotation: 0 } },
    { label: "Oversize",   p: { opacity: 0.95, thickness: 1.3,  speed: 1,   size: 1.4,  rotation: 0 } },
    { label: "Tilted",     p: { opacity: 0.9,  thickness: 1.1,  speed: 1,   size: 0.95, rotation: -14 } }
  ];
  const DICE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="1"/><circle cx="8" cy="8" r="1.3" fill="currentColor" stroke="none"/><circle cx="16" cy="8" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="8" cy="16" r="1.3" fill="currentColor" stroke="none"/><circle cx="16" cy="16" r="1.3" fill="currentColor" stroke="none"/></svg>';

  // Randomize an overlay's look & motion within tasteful ranges — "feels random"
  // without wandering into unusable extremes.
  // A fresh randomized look (does NOT touch the asset's live params) — used by
  // both the Randomize button and the "Surprise me" variations grid.
  function randomLook(asset) {
    const rnd = (lo, hi) => Math.round((lo + Math.random() * (hi - lo)) * 100) / 100;
    const p = Object.assign({}, DEFAULT_PARAMS, asset.paramPreset || {});
    p.opacity = rnd(0.45, 1);
    p.thickness = rnd(0.6, 2.2);
    if (asset.engine !== "static") p.speed = rnd(0.4, 3.2);
    p.size = rnd(0.65, 1.35);
    p.rotation = Math.round(rnd(-22, 22));
    if (asset.roundable) p.roundness = Math.round(rnd(0, 14));
    return p;
  }
  function randomizeAssetParams(asset) { Object.assign(getParams(asset), randomLook(asset)); }

  // Render an asset into a container at an explicit param set (independent of
  // the asset's live params) — the variations tiles use this.
  function renderVariantInto(container, asset, p) {
    const holder = document.createElement("div");
    holder.className = "var-stage";
    holder.innerHTML = asset.engine === "smil" ? asset.svg(nextRid(), p.speed) : asset.svg(nextRid());
    const svg = holder.querySelector("svg");
    if (svg) {
      svg.style.opacity = p.opacity;
      svg.style.setProperty("--t-mult", p.thickness);
      if (asset.engine === "css") svg.style.setProperty("--s-mult", p.speed);
      if (asset.roundable) svg.style.setProperty("--r-mult", p.roundness + "px");
      const g = ensureXformGroup(svg);
      const size = p.size == null ? 1 : p.size, rot = p.rotation || 0;
      if (!(size === 1 && rot === 0)) {
        const { w, h } = viewBoxSize(svg); const cx = w / 2, cy = h / 2;
        g.setAttribute("transform",
          "translate(" + cx + " " + cy + ") rotate(" + rot + ") scale(" + size + ") translate(" + (-cx) + " " + (-cy) + ")");
      }
    }
    container.appendChild(holder);
  }

  // "Surprise me" — a collapsible grid of randomized variants; click to adopt.
  function buildVariations(asset, onAdopt) {
    const details = document.createElement("details");
    details.className = "gen-section var-section";
    const summary = document.createElement("summary");
    summary.innerHTML = '<span class="sec-name">Surprise me — variations</span>';
    details.appendChild(summary);

    const body = document.createElement("div");
    body.className = "gen-section-body";
    const actions = document.createElement("div");
    actions.className = "var-actions";
    const reroll = document.createElement("button");
    reroll.className = "btn"; reroll.type = "button"; reroll.textContent = "Reroll";
    const hint = document.createElement("span");
    hint.className = "var-hint"; hint.textContent = "Click a tile to adopt its look.";
    actions.appendChild(reroll); actions.appendChild(hint);
    const grid = document.createElement("div");
    grid.className = "var-grid";
    body.appendChild(actions); body.appendChild(grid);
    details.appendChild(body);

    const COUNT = 12;
    function fill() {
      grid.innerHTML = "";
      for (let i = 0; i < COUNT; i++) {
        const params = randomLook(asset);
        const tile = document.createElement("button");
        tile.className = "var-tile"; tile.type = "button"; tile.title = "Adopt this variation";
        renderVariantInto(tile, asset, params);
        tile.addEventListener("click", () => { Object.assign(getParams(asset), params); persistParams(); onAdopt(); });
        grid.appendChild(tile);
      }
    }
    reroll.addEventListener("click", fill);
    // Render the 12 tiles lazily, only once the section is first opened.
    details.addEventListener("toggle", () => { if (details.open && !grid.childElementCount) fill(); });
    return details;
  }

  function buildParamControls(asset, stage, onReset) {
    const container = document.createElement("div");
    const p = getParams(asset);
    const controls = {};

    function syncControl(key) {
      const c = controls[key]; if (!c) return;
      c.input.value = p[key];
      c.valSpan.textContent = formatParamValue(key, p[key]);
    }
    // Re-apply after a bulk change (randomize / vibe): sync every slider, then
    // re-render — which re-bakes SMIL speed and re-wraps for size/rotation.
    function refreshAll() {
      Object.keys(controls).forEach(syncControl);
      renderAssetInto(stage, asset);
    }

    // --- quick-start strip: vibe starters + Randomize, first thing (studio-style)
    const strip = document.createElement("div");
    strip.className = "gen-quickstart";

    const qsLabel = document.createElement("span");
    qsLabel.className = "qs-label"; qsLabel.textContent = "Start";

    const qsField = document.createElement("div");
    qsField.className = "qs-field";
    const qsSelLabel = document.createElement("label");
    qsSelLabel.setAttribute("for", "vibe-select"); qsSelLabel.textContent = "Vibe";
    const vibeSel = document.createElement("select");
    vibeSel.id = "vibe-select";
    vibeSel.setAttribute("aria-label", "Pick a starting vibe");
    vibeSel.innerHTML = '<option value="">Starter…</option>' +
      VIBES.map((v, i) => '<option value="' + i + '">' + v.label + "</option>").join("");
    vibeSel.addEventListener("change", () => {
      const v = VIBES[parseInt(vibeSel.value, 10)];
      if (v) { Object.assign(p, DEFAULT_PARAMS, v.p); refreshAll(); }
      vibeSel.selectedIndex = 0; // reset so the same vibe can be re-applied
    });
    qsField.appendChild(qsSelLabel); qsField.appendChild(vibeSel);

    const randBtn = document.createElement("button");
    randBtn.className = "gen-randomize"; randBtn.type = "button";
    randBtn.title = "Randomize this overlay's look & motion";
    randBtn.innerHTML = DICE_SVG + " Randomize";
    randBtn.addEventListener("click", () => {
      randomizeAssetParams(asset); refreshAll();
      randBtn.classList.remove("rolling"); void randBtn.offsetWidth; randBtn.classList.add("rolling");
    });

    const shareBtn = document.createElement("button");
    shareBtn.className = "btn"; shareBtn.type = "button";
    shareBtn.textContent = "Copy link";
    shareBtn.title = "Copy a shareable link that reproduces this exact look";
    shareBtn.addEventListener("click", () => {
      copyText(shareURL(asset)).then(
        () => { shareBtn.textContent = "Copied!"; setTimeout(() => shareBtn.textContent = "Copy link", 1500); },
        () => { shareBtn.textContent = "Copy failed"; setTimeout(() => shareBtn.textContent = "Copy link", 1500); }
      );
    });

    const qsHint = document.createElement("span");
    qsHint.className = "qs-hint";
    qsHint.textContent = "Tuned looks persist + share — Copy link bakes the settings into a URL.";

    strip.appendChild(qsLabel); strip.appendChild(qsField);
    strip.appendChild(randBtn); strip.appendChild(shareBtn); strip.appendChild(qsHint);
    container.appendChild(strip);

    // --- sliders ---
    const wrap = document.createElement("div");
    wrap.className = "param-panel";

    function row(key, label, min, max, step, title) {
      const rowEl = document.createElement("div");
      rowEl.className = "param-row";
      if (title) rowEl.title = title;
      const lab = document.createElement("label");
      lab.textContent = label;
      const input = document.createElement("input");
      input.type = "range";
      input.min = min; input.max = max; input.step = step;
      input.value = p[key];
      const valSpan = document.createElement("span");
      valSpan.className = "param-value";
      valSpan.textContent = formatParamValue(key, p[key]);
      controls[key] = { input, valSpan };
      const isSmilSpeed = asset.engine === "smil" && key === "speed";
      input.addEventListener("input", () => {
        p[key] = parseFloat(input.value);
        valSpan.textContent = formatParamValue(key, p[key]);
        if (!isSmilSpeed) applyLiveParams(asset, stage);
      });
      if (isSmilSpeed) {
        input.addEventListener("change", () => renderAssetInto(stage, asset));
      }
      rowEl.appendChild(lab); rowEl.appendChild(input); rowEl.appendChild(valSpan);
      wrap.appendChild(rowEl);
    }

    row("size", "Size", 0.3, 1.6, 0.05, "Scale the overlay up or down, centred");
    if (asset.engine !== "static") row("speed", "Speed", 0.1, 5, 0.05, "Animation playback speed multiplier");
    row("rotation", "Rotation", -180, 180, 1, "Rotate the overlay around its centre");
    row("opacity", "Opacity", 0.15, 1, 0.05, "How see-through the overlay is");
    row("thickness", "Thickness", 0.25, 3, 0.05, "Stroke / line-weight multiplier");
    if (asset.roundable) row("roundness", "Roundness", 0, 16, 1, "Corner radius on roundable elements");

    const resetBtn = document.createElement("button");
    resetBtn.className = "btn";
    resetBtn.textContent = "Reset Adjustments";
    resetBtn.addEventListener("click", () => {
      Object.assign(p, DEFAULT_PARAMS);
      onReset();
    });
    wrap.appendChild(resetBtn);

    if (asset.engine !== "static" && !asset.loop) {
      const hint = document.createElement("div");
      hint.className = "param-hint";
      hint.textContent = "This piece plays once — adjust Speed, then hit Replay to see it at the new pace.";
      wrap.appendChild(hint);
    }

    container.appendChild(wrap);
    return container;
  }
