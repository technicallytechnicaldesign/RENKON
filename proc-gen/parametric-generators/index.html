  function buildPalettePanel() {
    // Collapsed by default (Lens 4B.1) — the one place a collapsed-by-default
    // disclosure is correct: this panel is a rarely-used advanced control
    // (recolors every asset's roles) that dominated every customize screen
    // even though most visits are here to tweak one asset's opacity/speed.
    // Every control inside stays one click away.
    const details = document.createElement("details");
    details.className = "palette-details";
    const summary = document.createElement("summary");
    summary.innerHTML = '<span class="chev" aria-hidden="true">&rsaquo;</span> Palette (advanced) — recolor all assets';
    details.appendChild(summary);

    const panel = document.createElement("div");
    panel.className = "palette-panel";

    PALETTE_ROLES.forEach(role => {
      const wrap = document.createElement("div");
      wrap.className = "palette-role";
      const label = document.createElement("label");
      label.textContent = role.label;
      const input = document.createElement("input");
      input.type = "color";
      input.value = palette[role.key];
      input.addEventListener("input", () => {
        palette[role.key] = input.value;
        applyPaletteToDOM(palette);
      });
      wrap.appendChild(label);
      wrap.appendChild(input);
      panel.appendChild(wrap);
    });

    const actions = document.createElement("div");
    actions.className = "palette-actions";
    const status = document.createElement("span");
    status.className = "save-status";

    // Storage: window.storage is an environment-injected API that's never
    // defined in a plain browser (see the identical rationale \u2014 and the
    // same fix \u2014 for the texture tool's preset persistence, mountTextureTool
    // -> presetStorageGet/Set below). Use localStorage directly so the
    // button actually works in every context this app runs in.
    const saveBtn = document.createElement("button");
    saveBtn.className = "btn";
    saveBtn.textContent = "Save Palette";
    saveBtn.addEventListener("click", () => {
      status.textContent = "Saving\u2026";
      try {
        localStorage.setItem("palette:default", JSON.stringify(palette));
        status.textContent = "Saved";
      } catch (e) { status.textContent = "Save failed"; }
      setTimeout(() => status.textContent = "", 2000);
    });

    const loadBtn = document.createElement("button");
    loadBtn.className = "btn";
    loadBtn.textContent = "Load Palette";
    loadBtn.addEventListener("click", () => {
      status.textContent = "Loading\u2026";
      try {
        const raw = localStorage.getItem("palette:default");
        if (raw) {
          palette = JSON.parse(raw);
          applyPaletteToDOM(palette);
          panel.querySelectorAll("input[type=color]").forEach((inp, i) => { inp.value = palette[PALETTE_ROLES[i].key]; });
          status.textContent = "Loaded";
        } else { status.textContent = "No saved palette"; }
      } catch (e) { status.textContent = "None saved yet"; }
      setTimeout(() => status.textContent = "", 2000);
    });

    const resetBtn = document.createElement("button");
    resetBtn.className = "btn";
    resetBtn.textContent = "Reset";
    resetBtn.addEventListener("click", () => {
      palette = defaultPalette();
      applyPaletteToDOM(palette);
      panel.querySelectorAll("input[type=color]").forEach((inp, i) => { inp.value = palette[PALETTE_ROLES[i].key]; });
    });

    actions.appendChild(saveBtn);
    actions.appendChild(loadBtn);
    actions.appendChild(resetBtn);
    actions.appendChild(status);
    panel.appendChild(actions);
    details.appendChild(panel);
    return details;
  }

  /* =========================================================
     TEXTURE & BUMP MAP GENERATOR
     First pass: a working procedural core (seeded value noise,
     plus two simpler grid/scratch generators) driven by a handful
     of sliders, with a live grayscale texture preview and a
     simulated-relief bump preview derived from the same height
     data. Both export as PNG at a higher resolution than the
     live preview. Deliberately kept to one flat screen and a
     small, obviously-extensible generator registry — more pattern
     types and normal-map (not just height) export are the natural
     next additions. Spatial (XY) tiling: Noise and Grid tile
     exactly (incl. animated); the rest are documented non-tiling —
     use the Tile Preview toggle to inspect seams.
     ========================================================= */
  const TEXTURE_PREVIEW_SIZE = 320;
  const TEXTURE_EXPORT_SIZE = 1024;

  function mulberry32(seed) {
    let s = seed >>> 0;
    return function () {
      s |= 0; s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function buildValueField(w, h, cellSize, rng) {
    const cols = Math.ceil(w / cellSize) + 2, rows = Math.ceil(h / cellSize) + 2;
    const grid = [];
    for (let y = 0; y < rows; y++) {
      const row = [];
      for (let x = 0; x < cols; x++) row.push(rng());
      grid.push(row);
    }
    return { grid, cellSize };
  }

  function sampleField(field, x, y) {
    const { grid, cellSize } = field;
    const gx = x / cellSize, gy = y / cellSize;
    const x0 = Math.floor(gx), y0 = Math.floor(gy);
    const sx = gx - x0, sy = gy - y0;
    const smooth = t => t * t * (3 - 2 * t);
    const sxs = smooth(sx), sys = smooth(sy);
    const v00 = grid[y0][x0], v10 = grid[y0][x0 + 1];
    const v01 = grid[y0 + 1][x0], v11 = grid[y0 + 1][x0 + 1];
    const top = v00 + (v10 - v00) * sxs;
    const bot = v01 + (v11 - v01) * sxs;
    return top + (bot - top) * sys;
  }

  // Toroidal variants used by the Noise pattern so its maps tile exactly in
  // X and Y (feature backlog #1). Two things differ from the non-tiling pair
  // above, and both are required: (1) the lattice is snapped to a whole
  // number of cells per tile (cell count = round(w / requestedCellSize),
  // min 1) — a cellSize that doesn't divide w/h evenly would still seam even
  // under modulo sampling; (2) the lattice is sampled with wraparound
  // ((x0 + 1) % cols) instead of reading into +2 padding rows/cols.
  // Deliberately a parallel pair rather than a change to
  // buildValueField/sampleField: Wood Grain, Waves, Machining Marks and
  // Paint Strokes use those as warp/flow fields and must stay byte-identical.
  function buildValueFieldTiling(w, h, cellSize, rng) {
    const cols = Math.max(1, Math.round(w / cellSize));
    const rows = Math.max(1, Math.round(h / cellSize));
    const grid = [];
    for (let y = 0; y < rows; y++) {
      const row = [];
      for (let x = 0; x < cols; x++) row.push(rng());
      grid.push(row);
    }
    return { grid, cols, rows, cellW: w / cols, cellH: h / rows };
  }

  function sampleFieldWrap(field, x, y) {
    const { grid, cols, rows, cellW, cellH } = field;
    const gx = x / cellW, gy = y / cellH;
    let x0 = Math.floor(gx), y0 = Math.floor(gy);
    const sx = gx - x0, sy = gy - y0;
    x0 = ((x0 % cols) + cols) % cols;
    y0 = ((y0 % rows) + rows) % rows;
    const x1 = (x0 + 1) % cols, y1 = (y0 + 1) % rows;
    const smooth = t => t * t * (3 - 2 * t);
    const sxs = smooth(sx), sys = smooth(sy);
    const v00 = grid[y0][x0], v10 = grid[y0][x1];
    const v01 = grid[y1][x0], v11 = grid[y1][x1];
    const top = v00 + (v10 - v00) * sxs;
    const bot = v01 + (v11 - v01) * sxs;
    return top + (bot - top) * sys;
  }

  function noiseData(w, h, p, seed) {
    const rng = mulberry32(seed);
    const octaves = Math.max(1, Math.round(p.octaves));
    const fields = [];
    let freq = Math.max(4, p.scale);
    for (let o = 0; o < octaves; o++) {
      // Tiling lattice per octave -> every octave (and therefore the summed
      // fBm) wraps exactly at x = w and y = h.
      fields.push(buildValueFieldTiling(w, h, Math.max(4, freq), rng));
      freq = Math.max(4, freq / 2);
    }
    const amps = []; let amp = 1, maxAmp = 0;
    for (let o = 0; o < octaves; o++) { amps.push(amp); maxAmp += amp; amp *= p.roughness; }
    const data = new Float32Array(w * h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        let v = 0;
        for (let o = 0; o < octaves; o++) v += sampleFieldWrap(fields[o], x, y) * amps[o];
        data[y * w + x] = v / maxAmp;
      }
    }
    return data;
  }

  function generateNoise(w, h, p) {
    const data = noiseData(w, h, p, p.seed);
    if (!p.animate) return data;
    // Animated: cyclically blend toward a second independent field and back.
    // weight = 0 at time 0 and 1, peaks at 0.5 -> guaranteed-seamless loop; the
    // static (time 0 / animation-off) frame is identical to the un-animated output.
    // Both fields come from noiseData and therefore both tile spatially, so
    // every blended frame of the animation tiles too.
    const dataB = noiseData(w, h, p, (p.seed ^ 0x9e3779b9) >>> 0);
    const wgt = 0.5 - 0.5 * Math.cos(2 * Math.PI * (p.time || 0));
    for (let i = 0; i < data.length; i++) data[i] = data[i] * (1 - wgt) + dataB[i] * wgt;
    return data;
  }

  function generateGrid(w, h, p) {
    const rng = mulberry32(p.seed);
    const count = Math.max(2, Math.round(p.count));
    const spacing = Math.max(4, w / count);
    const thickness = Math.min(spacing * 0.4, Math.max(1, p.scale * 0.08 * p.contrast));
    const jitter = p.roughness * spacing * 0.15;
    // Animated: a phase-shifted sinusoidal displacement of the sampling coords
    // reads as heat-shimmer / vibration. Period 1 in time -> seamless loop.
    const tm = p.time || 0;
    const shimmer = p.animate ? spacing * 0.18 : 0;
    // Spatial tiling (feature backlog #1): the static grid already tiles
    // because spacing = w / count divides w exactly (per-pixel jitter is
    // structureless noise, uniform across the seam). The shimmer's spatial
    // frequency is quantized to a whole number of cycles per tile (nearest
    // to the old fixed 0.06 rad/px; ~3 cycles at 320px) so animated frames
    // wrap exactly at x = w and y = h with the same visual character.
    const TAU = 2 * Math.PI;
    const shimFreqY = TAU * Math.max(1, Math.round(0.06 * h / TAU)) / h;
    const shimFreqX = TAU * Math.max(1, Math.round(0.06 * w / TAU)) / w;
    const data = new Float32Array(w * h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const jx = x + (rng() - 0.5) * jitter + shimmer * Math.sin(TAU * tm + y * shimFreqY);
        const jy = y + (rng() - 0.5) * jitter + shimmer * Math.cos(TAU * tm + x * shimFreqX);
        const mx = ((jx % spacing) + spacing) % spacing;
        const my = ((jy % spacing) + spacing) % spacing;
        data[y * w + x] = (mx < thickness || my < thickness) ? 1 : 0.15;
      }
    }
    return data;
  }

  function generateScratches(w, h, p) {
    const rng = mulberry32(p.seed);
    const data = new Float32Array(w * h).fill(0.5);
    const count = Math.max(1, Math.round(p.count));
    // Animated: each streak fades in/out once per loop on its own staggered
    // phase (film-grain / static flicker). Envelope is periodic -> seamless.
    const tm = p.time || 0;
    for (let i = 0; i < count; i++) {
      const x0 = rng() * w;
      const y0 = rng() * h;
      const len = h * (0.2 + rng() * 0.65) * (p.scale / 60);
      const drift = (rng() - 0.5) * w * 0.25;
      const depth = (0.25 + rng() * 0.5) * Math.min(2, p.contrast);
      const env = p.animate ? Math.pow(0.5 + 0.5 * Math.sin(2 * Math.PI * (tm - i / count)), 1.6) : 1;
      const depthA = depth * env;
      const steps = Math.max(1, Math.round(len));
      for (let s = 0; s < steps; s++) {
        const t = s / steps;
        const xx = Math.round(x0 + drift * t + (rng() - 0.5) * p.roughness * 3);
        const yy = Math.round(y0 + t * len);
        if (xx >= 0 && xx < w && yy >= 0 && yy < h) {
          const idx = yy * w + xx;
          data[idx] = Math.max(0, data[idx] - depthA * 0.5);
        }
      }
    }
    return data;
  }

  function generateSplotches(w, h, p) {
    const rng = mulberry32(p.seed);
    const data = new Float32Array(w * h).fill(0.35);
    const count = Math.max(1, Math.round(p.count));
    const maxR = Math.max(4, p.scale);
    // Animated: each blob pulses size + strength on its own staggered phase
    // (boiling / bubbling surface). Period 1 in time -> seamless loop.
    const tm = p.time || 0;
    for (let i = 0; i < count; i++) {
      const cx = rng() * w, cy = rng() * h;
      let r = maxR * (0.15 + rng() * (0.15 + p.roughness * 0.25));
      let strength = 0.35 + rng() * 0.5;
      if (p.animate) {
        const pulse = 0.5 + 0.5 * Math.sin(2 * Math.PI * (tm - i / count));
        r *= 0.6 + 0.4 * pulse;
        strength *= 0.5 + 0.5 * pulse;
      }
      const x0 = Math.max(0, Math.floor(cx - r)), x1 = Math.min(w, Math.ceil(cx + r));
      const y0 = Math.max(0, Math.floor(cy - r)), y1 = Math.min(h, Math.ceil(cy + r));
      for (let y = y0; y < y1; y++) {
        for (let x = x0; x < x1; x++) {
          const dx = x - cx, dy = y - cy;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < r) {
            const falloff = 1 - dist / r;
            const idx = y * w + x;
            data[idx] = Math.min(1, data[idx] + falloff * falloff * strength);
          }
        }
      }
    }
    return data;
  }

  // Shared Worley (cellular noise) field: a jittered grid of one feature point
  // per cell, searched over its 3x3 cell neighborhood -- the standard
  // efficient approach so a per-pixel nearest-point query stays O(1) instead
  // of O(n). Cellular and Cracks both build on this; they differ only in how
  // they read d1 (distance to nearest point) / d2 (second-nearest).
  function buildWorleyField(w, h, cellSize, rng) {
    const cols = Math.ceil(w / cellSize) + 2, rows = Math.ceil(h / cellSize) + 2;
    const pts = [];
    for (let gy = 0; gy < rows; gy++) {
      const row = [];
      for (let gx = 0; gx < cols; gx++) {
        row.push({ x: (gx - 1 + rng()) * cellSize, y: (gy - 1 + rng()) * cellSize, phase: rng() });
      }
      pts.push(row);
    }
    return { pts, cellSize };
  }

  function sampleWorley(field, x, y, wiggle, time) {
    const { pts, cellSize } = field;
    const cx = Math.floor(x / cellSize) + 1, cy = Math.floor(y / cellSize) + 1;
    let d1 = Infinity, d2 = Infinity;
    for (let oy = -1; oy <= 1; oy++) {
      const row = pts[cy + oy];
      for (let ox = -1; ox <= 1; ox++) {
        const pt = row[cx + ox];
        let px = pt.x, py = pt.y;
        if (wiggle) {
          const a = 2 * Math.PI * (time - pt.phase);
          px += wiggle * Math.sin(a); py += wiggle * Math.cos(a);
        }
        const dx = x - px, dy = y - py;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) { d2 = d; }
      }
    }
    return { d1, d2 };
  }

  function generateCellular(w, h, p) {
    const rng = mulberry32(p.seed);
    const count = Math.max(2, Math.round(p.count));
    const cellSize = Math.max(4, w / count);
    const field = buildWorleyField(w, h, cellSize, rng);
    // Animated: feature points wiggle around their own seeded phase -- cells
    // breathe/drift in place. Period 1 in time -> seamless loop.
    const wiggle = p.animate ? cellSize * 0.18 : 0;
    const tm = p.time || 0;
    const soft = 0.15 + p.roughness * 0.7;
    const data = new Float32Array(w * h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const { d1 } = sampleWorley(field, x, y, wiggle, tm);
        data[y * w + x] = 1 - Math.min(1, d1 / (cellSize * soft));
      }
    }
    return data;
  }

  function generateCracks(w, h, p) {
    const rng = mulberry32(p.seed);
    const count = Math.max(2, Math.round(p.count));
    const cellSize = Math.max(4, w / count);
    const field = buildWorleyField(w, h, cellSize, rng);
    const wiggle = p.animate ? cellSize * 0.1 : 0;
    const tm = p.time || 0;
    const width = Math.max(0.01, 0.06 + p.roughness * 0.12) * cellSize;
    const data = new Float32Array(w * h).fill(1);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const { d1, d2 } = sampleWorley(field, x, y, wiggle, tm);
        const edge = d2 - d1;
        if (edge < width) data[y * w + x] = edge / width;
      }
    }
    return data;
  }

  function generateWood(w, h, p) {
    const seedRng = mulberry32(p.seed);
    const cx = (0.2 + seedRng() * 0.6) * w, cy = (0.2 + seedRng() * 0.6) * h;
    const warpField = buildValueField(w, h, Math.max(8, p.scale), mulberry32((p.seed ^ 0x2545F491) >>> 0));
    const ringSpacing = Math.max(3, p.scale * 0.35);
    const warpAmt = p.roughness * ringSpacing * 2;
    // Animated: rings travel outward from the pith at a steady rate -- phase
    // is subtracted inside the sine, so time 0 and time 1 land on the same
    // ring position (seamless loop).
    const phase = p.animate ? (p.time || 0) : 0;
    const data = new Float32Array(w * h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const dx = x - cx, dy = y - cy;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const warp = (sampleField(warpField, x, y) - 0.5) * warpAmt;
        const ring = Math.sin((dist + warp) / ringSpacing * 2 * Math.PI - phase * 2 * Math.PI);
        data[y * w + x] = 0.5 + 0.5 * ring;
      }
    }
    return data;
  }

  function generateWaves(w, h, p) {
    const rng = mulberry32(p.seed);
    const freq = Math.max(4, p.scale);
    const angle = rng() * Math.PI;
    const ax = Math.cos(angle), ay = Math.sin(angle);
    const warpField = buildValueField(w, h, Math.max(8, p.scale), mulberry32((p.seed ^ 0x85EBCA6B) >>> 0));
    const warpAmt = p.roughness * freq * 0.6;
    // Animated: bands travel along their own axis -- phase subtracted inside
    // the sine gives a seamless loop, same trick as Wood Grain's rings.
    const phase = p.animate ? (p.time || 0) : 0;
    const data = new Float32Array(w * h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const warp = (sampleField(warpField, x, y) - 0.5) * warpAmt;
        const proj = (x * ax + y * ay + warp) / freq;
        const wave = Math.sin(proj * 2 * Math.PI - phase * 2 * Math.PI);
        data[y * w + x] = 0.5 + 0.5 * wave;
      }
    }
    return data;
  }

  /* ---------------------------------------------------------
     PRO FINISH -- art-directed fabrication textures
     (ADVANCED_TEXTURES brief, lab repo). Unlike the generic patterns
     above, these model a specific real finishing process, and
     they use the per-pattern custom-param mechanism: extra
     controls declared in PATTERN_META[kind].custom, values
     living in state.custom[kind][key]. Custom *length* params
     (pitch, strokeLength) are specified in px at preview size
     and normalized by w / TEXTURE_PREVIEW_SIZE inside the
     generator, so the 320px preview and the 1024px export show
     the same texture rather than a 3x-finer one.
     --------------------------------------------------------- */

  function generateMachining(w, h, p) {
    const c = (p.custom && p.custom.machining) || {};
    const res = w / TEXTURE_PREVIEW_SIZE; // custom lengths are "px at preview size"
    const pitch = Math.max(2, c.pitch != null ? c.pitch : 10) * res;
    const waviness = c.waviness != null ? c.waviness : 0.15;
    const radial = c.direction === "radial";
    const rng = mulberry32(p.seed);
    const angle = rng() * Math.PI; // seeded pass direction (linear mode)
    const ax = Math.cos(angle), ay = Math.sin(angle);
    // Low-frequency toolpath wander: a real mill/lathe pass is not perfectly
    // straight at the pixel level. Amplitude driven by `waviness`, kept
    // proportional to pitch so grooves wander without smearing together.
    const warpField = buildValueField(w, h, Math.max(8, pitch * 4), mulberry32((p.seed ^ 0x3C6EF372) >>> 0));
    const warpAmt = waviness * pitch * 1.5;
    // Roughness = groove-edge sharpness: low keeps the crisp full-depth
    // cosine groove, high flattens it toward mid-gray (a worn / fine pass).
    const depth = Math.min(1, 1.05 - p.roughness);
    // Animated: the toolpath advances -- phase subtracted inside the cosine,
    // so time 0 and time 1 land on the same groove position (seamless loop).
    const phase = p.animate ? (p.time || 0) : 0;
    const data = new Float32Array(w * h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const warp = (sampleField(warpField, x, y) - 0.5) * warpAmt;
        let d;
        if (radial) {
          // Lathe/faced part: concentric grooves around the canvas center --
          // deliberately centered (unlike Wood Grain's seeded pith), because
          // a machined face reads as centered and stays placeable.
          const dx = x - w / 2, dy = y - h / 2;
          d = Math.sqrt(dx * dx + dy * dy);
        } else {
          d = x * ax + y * ay;
        }
        const groove = Math.cos(((d + warp) / pitch - phase) * 2 * Math.PI);
        data[y * w + x] = 0.5 + 0.5 * groove * depth;
      }
    }
    return data;
  }

  function generatePaintStrokes(w, h, p) {
    const c = (p.custom && p.custom.paint) || {};
    const res = w / TEXTURE_PREVIEW_SIZE; // custom lengths are "px at preview size"
    const strokeLength = Math.max(8, c.strokeLength != null ? c.strokeLength : 80) * res;
    const turbulence = c.turbulence != null ? c.turbulence : 0.5;
    const rng = mulberry32(p.seed);
    const baseAngle = rng() * Math.PI;
    // Low-frequency flow field: each stroke bends with the local field value,
    // so strokes share a smoothly-varying regional direction (hand-brushed)
    // instead of one fixed global angle (printed) or unrelated random
    // segments (Scratches).
    const flowField = buildValueField(w, h, Math.max(16, w / 5), mulberry32((p.seed ^ 0x1B873593) >>> 0));
    const count = Math.max(1, Math.round(p.count));
    const stepLen = Math.max(1, 2 * res);
    const brushR = Math.max(1.5, 5 * res);
    // Roughness = dab softness: low keeps a hard-edged dab, high pushes the
    // falloff exponent up for a soft, feathered edge.
    const soft = 0.8 + p.roughness * 2.4;
    const tm = p.time || 0;
    const data = new Float32Array(w * h).fill(0.18);
    for (let i = 0; i < count; i++) {
      // All per-stroke randomness is drawn up front (never inside the step
      // loop), so a partially-revealed stroke follows the exact same path as
      // the fully-grown one and later strokes are unaffected by reveal.
      let sx = rng() * w, sy = rng() * h;
      const strength = 0.3 + rng() * 0.4;
      const stagger = rng();
      // Animated: progressive reveal -- each stroke grows along its length as
      // time runs 0 -> 1 (slightly staggered per stroke), then resets and
      // re-grows each cycle. NOTE (deliberate exception to the seamless-loop
      // convention): the frame just before the loop point shows fully grown
      // strokes and frame 0 shows them at 0%, i.e. a one-frame "snap" at the
      // loop boundary. Documented as acceptable in the ADVANCED_TEXTURES brief
      // -- not a bug. Static (animate off) renders the fully grown strokes.
      const reveal = p.animate ? Math.max(0, Math.min(1, tm * 1.25 - stagger * 0.25)) : 1;
      const steps = Math.max(2, Math.round(strokeLength / stepLen));
      const drawn = Math.round(steps * reveal);
      for (let s = 0; s < drawn; s++) {
        const t = s / steps;
        // soft round brush dab, width tapering slightly at both stroke ends
        const r = brushR * (0.45 + 0.55 * Math.sin(Math.PI * t));
        const x0 = Math.max(0, Math.floor(sx - r)), x1 = Math.min(w, Math.ceil(sx + r));
        const y0 = Math.max(0, Math.floor(sy - r)), y1 = Math.min(h, Math.ceil(sy + r));
        for (let yy = y0; yy < y1; yy++) {
          for (let xx = x0; xx < x1; xx++) {
            const dx = xx - sx, dy = yy - sy;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < r) {
              const fall = Math.pow(1 - dist / r, soft);
              const idx = yy * w + xx;
              data[idx] = Math.min(1, data[idx] + fall * strength * 0.45);
            }
          }
        }
        // step along the local flow direction; turbulence scales how far the
        // field bends the stroke off the shared base angle. Sample coords are
        // clamped to the canvas: strokes may wander off-canvas (their dabs
        // just stop depositing) but the value field only covers the canvas
        // plus a small margin -- sampling beyond it reads off the grid.
        const fx = Math.min(w - 1, Math.max(0, sx));
        const fy = Math.min(h - 1, Math.max(0, sy));
        const bend = (sampleField(flowField, fx, fy) - 0.5) * turbulence * 3;
        sx += Math.cos(baseAngle + bend) * stepLen;
        sy += Math.sin(baseAngle + bend) * stepLen;
      }
    }
    return data;
  }

  // --- P2 stretch goals (ADVANCED_TEXTURES brief, "P2 -- stretch goals,
  // fleshed out") -- Knurling, Orange Peel, Anodize Swirl. Same Pro Finish
  // family and custom-param mechanism as Machining Marks/Paint Strokes
  // above; built in the doc's suggested order (cheapest/most-reused-
  // machinery first): Knurling (pure math, reuses Machining's cosine-groove
  // profile), Orange Peel (small extension of Cellular's Worley machinery),
  // Anodize Swirl (extends Paint Strokes' accumulation loop with ring-biased
  // seeding + a tangential base direction).

  function generateKnurling(w, h, p) {
    const c = (p.custom && p.custom.knurl) || {};
    const res = w / TEXTURE_PREVIEW_SIZE; // custom lengths are "px at preview size"
    const pitch = Math.max(2, c.pitch != null ? c.pitch : 10) * res;
    const angleDeg = c.angle != null ? c.angle : 30;
    const cross = c.mode !== "straight"; // default: diamond (crossed) knurl
    const angleA = angleDeg * Math.PI / 180;
    const angleB = angleA + Math.PI / 2; // second band derived from angle+90,
    // not a hardcoded +-45 -- so `angle` drives the whole pattern's
    // orientation and any crossing (not just a symmetric diamond) is reachable.
    const axA = Math.cos(angleA), ayA = Math.sin(angleA);
    const axB = Math.cos(angleB), ayB = Math.sin(angleB);
    // Roughness = groove-edge sharpness, same role as Machining Marks (low
    // keeps a crisp full-depth cosine groove, high flattens toward mid-gray).
    const depth = Math.min(1, 1.05 - p.roughness);
    // Animated: both bands' phase advances together -- reads as the tool
    // still cutting. Phase subtracted inside the cosine -> time 0 and time 1
    // land on the same groove position (seamless loop).
    const phase = p.animate ? (p.time || 0) : 0;
    const data = new Float32Array(w * h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const dA = x * axA + y * ayA;
        const bandA = 0.5 + 0.5 * Math.cos((dA / pitch - phase) * 2 * Math.PI) * depth;
        if (cross) {
          const dB = x * axB + y * ayB;
          const bandB = 0.5 + 0.5 * Math.cos((dB / pitch - phase) * 2 * Math.PI) * depth;
          data[y * w + x] = bandA * bandB;
        } else {
          data[y * w + x] = bandA;
        }
      }
    }
    return data;
  }

  function generateOrangePeel(w, h, p) {
    const c = (p.custom && p.custom.peel) || {};
    const blend = c.blend != null ? c.blend : 0.25;
    const rng = mulberry32(p.seed);
    const count = Math.max(2, Math.round(p.count));
    // Fine dimpling reads at a noticeably smaller cell size than Cellular's
    // own blobs -- w/(count*3), not Cellular's w/count.
    const cellSize = Math.max(3, w / (count * 3));
    const field = buildWorleyField(w, h, cellSize, rng);
    // Low-frequency noise blended in for irregularity, so cells don't look
    // perfectly regular -- sized to the same order as the Worley cells
    // themselves (not an unrelated frequency) so the two read as one finish.
    const noiseField = buildValueField(w, h, Math.max(4, cellSize * 1.5), mulberry32((p.seed ^ 0x27D4EB2F) >>> 0));
    // Animated: reuse Cellular's wiggle-the-feature-points trick verbatim --
    // already seamless, already proven; this is a finish variant of
    // Cellular, not a new animation personality.
    const wiggle = p.animate ? cellSize * 0.18 : 0;
    const tm = p.time || 0;
    // Roughness = Worley falloff softness, same role it plays in generateCellular.
    const soft = 0.15 + p.roughness * 0.7;
    const data = new Float32Array(w * h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const { d1 } = sampleWorley(field, x, y, wiggle, tm);
        const worleyValue = 1 - Math.min(1, d1 / (cellSize * soft));
        const noiseValue = sampleField(noiseField, x, y);
        data[y * w + x] = worleyValue * (1 - blend) + noiseValue * blend;
      }
    }
    return data;
  }

  function generateAnodizeSwirl(w, h, p) {
    const c = (p.custom && p.custom.anodize) || {};
    const res = w / TEXTURE_PREVIEW_SIZE; // custom lengths are "px at preview size"
    const strokeLength = Math.max(8, c.strokeLength != null ? c.strokeLength : 80) * res;
    const turbulence = c.turbulence != null ? c.turbulence : 0.5;
    const rng = mulberry32(p.seed);
    const cx = w / 2, cy = h / 2;
    const maxRadius = Math.sqrt(cx * cx + cy * cy);
    // Same flow field role as Paint Strokes: perturbs the base direction so
    // strokes don't look mechanically perfect.
    const flowField = buildValueField(w, h, Math.max(16, w / 5), mulberry32((p.seed ^ 0x1B873593) >>> 0));
    const count = Math.max(1, Math.round(p.count));
    const stepLen = Math.max(1, 2 * res);
    const brushR = Math.max(1.5, 5 * res);
    // Roughness = dab softness, same role it plays in generatePaintStrokes.
    const soft = 0.8 + p.roughness * 2.4;
    const tm = p.time || 0;
    const data = new Float32Array(w * h).fill(0.18);
    for (let i = 0; i < count; i++) {
      // Ring-biased seeding: sqrt(rng()) gives a uniform-area distribution
      // over the disc (rather than uniform-radius, which over-concentrates
      // points near dead-center) -- radial brushing reads denser away from
      // the center, not uniformly across the whole canvas.
      const r = maxRadius * Math.sqrt(rng());
      const theta = rng() * 2 * Math.PI;
      let sx = cx + r * Math.cos(theta), sy = cy + r * Math.sin(theta);
      const strength = 0.3 + rng() * 0.4;
      const stagger = rng();
      // Animated: same progressive-reveal trick as Paint Strokes, including
      // the same documented one-frame loop-boundary snap (frame just before
      // the loop shows fully-grown strokes, frame 0 shows 0% grown) -- this
      // is the same deliberate, accepted trade-off Paint Strokes' own
      // comment calls out, not a new bug. Static (animate off) renders the
      // fully grown strokes, matching Paint Strokes' convention.
      const reveal = p.animate ? Math.max(0, Math.min(1, tm * 1.25 - stagger * 0.25)) : 1;
      const steps = Math.max(2, Math.round(strokeLength / stepLen));
      const drawn = Math.round(steps * reveal);
      for (let s = 0; s < drawn; s++) {
        const t = s / steps;
        const rr = brushR * (0.45 + 0.55 * Math.sin(Math.PI * t));
        const x0 = Math.max(0, Math.floor(sx - rr)), x1 = Math.min(w, Math.ceil(sx + rr));
        const y0 = Math.max(0, Math.floor(sy - rr)), y1 = Math.min(h, Math.ceil(sy + rr));
        for (let yy = y0; yy < y1; yy++) {
          for (let xx = x0; xx < x1; xx++) {
            const dx = xx - sx, dy = yy - sy;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < rr) {
              const fall = Math.pow(1 - dist / rr, soft);
              const idx = yy * w + xx;
              data[idx] = Math.min(1, data[idx] + fall * strength * 0.45);
            }
          }
        }
        // Tangential base direction, recomputed each step from the stroke's
        // *current* position -- atan2(y - cy, x - cx) + PI/2 is perpendicular
        // to the radius vector from canvas center, so the stroke curves
        // around the center instead of following one fixed straight angle
        // (that's what makes this "radial variant of Paint Strokes" rather
        // than just Paint Strokes with a different seed distribution). Still
        // perturbed by the same turbulence-scaled flow-field bend Paint
        // Strokes uses, so it doesn't look mechanically perfect.
        const baseAngle = Math.atan2(sy - cy, sx - cx) + Math.PI / 2;
        const fx = Math.min(w - 1, Math.max(0, sx));
        const fy = Math.min(h - 1, Math.max(0, sy));
        const bend = (sampleField(flowField, fx, fy) - 0.5) * turbulence * 3;
        sx += Math.cos(baseAngle + bend) * stepLen;
        sy += Math.sin(baseAngle + bend) * stepLen;
      }
    }
    return data;
  }

  // preset stays well-formed even if the active pattern later changes).
  function defaultCustomState() {
    const custom = {};

      (PATTERN_META[kind].custom || []).forEach(def => {
        (custom[kind] = custom[kind] || {})[def.key] = def.default;

  function builtinPresetState(overrides, customOverrides) {

  function applyContrast(data, contrast) {
    for (let i = 0; i < data.length; i++) {
      data[i] = Math.min(1, Math.max(0, (data[i] - 0.5) * contrast + 0.5));
    }
  }

  // Photoshop-style levels: remap [black, white] to [0, 1] then apply a gamma
  // (midtone) curve. Runs after contrast, before invert.
  function applyLevels(data, black, white, gamma) {
    const range = Math.max(1e-4, white - black);
    const invGamma = 1 / Math.max(0.05, gamma);
    for (let i = 0; i < data.length; i++) {
      let v = (data[i] - black) / range;
      v = Math.min(1, Math.max(0, v));
      data[i] = Math.pow(v, invGamma);
    }
  }

  function paintHeightMap(canvas, data, w, h) {
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext("2d");
    const img = ctx.createImageData(w, h);
    for (let i = 0; i < data.length; i++) {
      const v = Math.round(data[i] * 255);
      img.data[i * 4] = v; img.data[i * 4 + 1] = v; img.data[i * 4 + 2] = v; img.data[i * 4 + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }

  function paintBumpPreview(canvas, data, w, h, bumpStrength, lightAngleDeg) {
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext("2d");
    const img = ctx.createImageData(w, h);
    const angle = (lightAngleDeg * Math.PI) / 180;
    const lx = Math.cos(angle), ly = Math.sin(angle);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const xp = Math.min(w - 1, x + 1), xm = Math.max(0, x - 1);
        const yp = Math.min(h - 1, y + 1), ym = Math.max(0, y - 1);
        const dx = (data[y * w + xp] - data[y * w + xm]) * bumpStrength;
        const dy = (data[yp * w + x] - data[ym * w + x]) * bumpStrength;
        let shade = 0.55 - (dx * lx + dy * ly) * 1.5;
        shade = Math.min(1, Math.max(0, shade));
        const v = Math.round(shade * 255);
        const idx = (y * w + x) * 4;
        img.data[idx] = v; img.data[idx + 1] = v; img.data[idx + 2] = v; img.data[idx + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  // Sobel-filter height-to-normal-map conversion (feature backlog #2). Operates
  // on the same grayscale `data` array computeTextureData produces, at export
  // size — pattern-agnostic (works for all pattern kinds unmodified). `at()`
  // wraps toroidally regardless of whether the source pattern actually tiles
  // (see FEATURE_BACKLOG brief item #2): for non-tiling patterns this is a
  // harmless one-pixel-wide inaccuracy at the border, and avoids needing
  // separate edge-clamping logic. `strength` reuses state.bumpStrength so the
  // normal map's apparent intensity matches the bump preview already shown.
  function heightToNormalMap(data, w, h, strength) {
    const out = new Uint8ClampedArray(w * h * 4);
    const at = (x, y) => data[((y + h) % h) * w + ((x + w) % w)];
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const l = at(x - 1, y), r = at(x + 1, y), u = at(x, y - 1), d = at(x, y + 1);
        const dx = (l - r) * strength, dy = (u - d) * strength;
        const len = Math.sqrt(dx * dx + dy * dy + 1);
        const idx = (y * w + x) * 4;
        out[idx]     = Math.round((dx / len * 0.5 + 0.5) * 255); // R
        out[idx + 1] = Math.round((dy / len * 0.5 + 0.5) * 255); // G
        out[idx + 2] = Math.round((1 / len * 0.5 + 0.5) * 255);  // B
        out[idx + 3] = 255;
      }
    }
    return out;
  }

  function paintNormalMap(canvas, data, w, h, bumpStrength) {
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext("2d");
    const img = ctx.createImageData(w, h);
    img.data.set(heightToNormalMap(data, w, h, bumpStrength));
    ctx.putImageData(img, 0, 0);
  }

  function computeTextureData(size, state) {
    const gen = TEXTURE_GENERATORS[state.pattern] || generateNoise;
    const data = gen(size, size, state);
    applyContrast(data, state.contrast);
    applyLevels(data, state.levelsBlack, state.levelsWhite, state.levelsGamma);
    if (state.invert) { for (let i = 0; i < data.length; i++) data[i] = 1 - data[i]; }
    return data;
  }

    });

    const state = {
      pattern: "noise",
      scale: 60,
      octaves: 4,
      count: 24,
      roughness: 0.5,
      contrast: 1.2,
      levelsBlack: 0,
      levelsWhite: 1,
      levelsGamma: 1,
      bumpStrength: 1,
      lightAngle: 135,
      invert: false,
      seed: Math.floor(Math.random() * 1e9),
      animate: false,
      time: 0,
      custom: {}
    };

    // Per-pattern custom params (Pro Finish patterns): eagerly seed every
    // declared custom param with its default. Because every export path
    // (static PNG + frame sequence) passes `state` straight into
    // computeTextureData, custom params flow into exports with no
    // export-code changes.
    Object.keys(PATTERN_META).forEach(kind => {
      (PATTERN_META[kind].custom || []).forEach(def => {
        (state.custom[kind] = state.custom[kind] || {})[def.key] = def.default;
      });
    });

    const controls = document.createElement("div");
    controls.className = "param-panel texture-controls";
    main.appendChild(controls);

    // Ordered, labeled sections (Lens 4A reorg, later made uniformly
    // collapsible for the mobile-responsiveness pass): PRESET -> PATTERN ->
    // SHAPE (+ PATTERN OPTIONS) -> SURFACE & TONE -> PREVIEW & ANIMATION.
    // Purely a DOM-grouping helper — every row/control built below is the
    // same element, wired the same way, just appended into a labeled
    // container instead of one flat wall. Every section here is a
    // <details open> (expanded by default, so nothing is hidden — just
    // collapsible, so a long control panel doesn't have to stay fully
    // expanded on a small screen); see EXPORT below for the export group's
    // own <details open> block. The primary "Static maps" export actions
    // are deliberately NOT collapsible — see EXPORT.
    function section(label, opts) {
      opts = opts || {};
      const wrap = document.createElement(opts.details ? "details" : "div");
      wrap.className = "control-section";
      // Closed by default (see CHANGELOG "Collapsed by default" entry) — a
      // first-time view of this panel should read as a short, calm list of
      // section headers, not five sections' worth of controls all at once.
      // Nothing is hidden permanently: every section is one click away.
      if (opts.details) wrap.open = false;
      const head = document.createElement(opts.details ? "summary" : "div");
      head.className = "section-label";
      head.innerHTML = opts.details ? `<span class="chev" aria-hidden="true">&rsaquo;</span> ${label}` : label;
      wrap.appendChild(head);
      const body = document.createElement("div");
      body.className = "texture-sliders";
      wrap.appendChild(body);
      controls.appendChild(wrap);
      return body;
    }

    // --- 1. PRESET ---------------------------------------------------------
    const presetBody = section("Preset", { details: true });
    const presetHelp = document.createElement("div");
    presetHelp.className = "param-hint";
    presetHelp.textContent = "Start from a preset, then tweak — or build from scratch below.";
    presetBody.appendChild(presetHelp);

    const presetRow = document.createElement("div");
    presetRow.className = "param-row";
    const presetRowLabel = document.createElement("label");
    presetRowLabel.textContent = "Preset";
    presetRow.appendChild(presetRowLabel);
    // Preset dropdown + Save button. Population/wiring happens further down,
    // once every control that a preset can affect (sliders, custom rows,
    // pattern buttons, invert) has been built — the dropdown's change
    // handler needs to resync all of it.
    const presetSelect = document.createElement("select");
    presetSelect.className = "btn";
    presetSelect.title = "Load a saved preset";
    const savePresetBtn = document.createElement("button");
    savePresetBtn.className = "btn";
    savePresetBtn.textContent = "Save Preset";
    const presetStatus = document.createElement("span");
    presetStatus.className = "param-value";
    presetStatus.style.minWidth = "0";
    presetRow.appendChild(presetSelect);
    presetRow.appendChild(savePresetBtn);
    presetRow.appendChild(presetStatus);
    presetBody.appendChild(presetRow);

    // --- 2. PATTERN ----------------------------------------------------------
    const patternBody = section("Pattern", { details: true });
    const patternHelp = document.createElement("div");
    patternHelp.className = "param-hint";
    patternHelp.textContent = "Filter by group, or browse everything, then pick a pattern.";
    patternBody.appendChild(patternHelp);

    // Icon-driven group filter: narrows the pattern list below to one group
    // at a time (or "All"). Groups stay in the DOM always — this just toggles
    // display, same approach as the per-pattern custom-param rows — so no
    // pattern, event listener, or piece of state is ever removed.
    const patternFilterRow = document.createElement("div");
    patternFilterRow.className = "pattern-filter-row";
    const groupWrapByLabel = {};
    function applyPatternFilter(filter) {
      Array.prototype.forEach.call(patternFilterRow.children, chip => {
        chip.classList.toggle("active", chip.dataset.filter === filter);
      });
      Object.keys(groupWrapByLabel).forEach(label => {
        groupWrapByLabel[label].style.display = (filter === "all" || filter === label) ? "flex" : "none";
      });
    }
    function filterChip(filterKey, label, icon) {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "filter-chip";
      chip.dataset.filter = filterKey;
      chip.innerHTML = '<span class="ic" aria-hidden="true">' + icon + "</span><span>" + label + "</span>";
      chip.addEventListener("click", () => applyPatternFilter(filterKey));
      patternFilterRow.appendChild(chip);
      return chip;
    }
    filterChip("all", "All", ALL_ICON);
    PATTERN_GROUPS.forEach(group => filterChip(group.label, group.label, GROUP_ICONS[group.label]));
    patternBody.appendChild(patternFilterRow);

    const patternRow = document.createElement("div");
    patternRow.className = "param-row";
    const patternLabel = document.createElement("label");
    patternLabel.textContent = "Pattern";
    patternRow.appendChild(patternLabel);
    const patternGroup = document.createElement("div");
    patternGroup.className = "pattern-groups";
    patternRow.appendChild(patternGroup);
    patternBody.appendChild(patternRow);

    const seedRow = document.createElement("div");
    seedRow.className = "param-row";
    const seedLabel = document.createElement("label");
    seedLabel.textContent = "Seed";
    const seedValue = document.createElement("span");
    seedValue.className = "param-value";
    seedValue.style.minWidth = "90px";
    const randomizeBtn = document.createElement("button");
    randomizeBtn.className = "btn";
    randomizeBtn.textContent = "Roll";
    randomizeBtn.title = "Re-roll the seed (keeps the current settings)";
    randomizeBtn.addEventListener("click", () => {
      state.seed = Math.floor(Math.random() * 1e9);
      seedValue.textContent = String(state.seed);
      regenerate();
    });
    seedRow.appendChild(seedLabel);
    seedRow.appendChild(seedValue);
    seedRow.appendChild(randomizeBtn);
    patternBody.appendChild(seedRow);

    // --- 3. SHAPE (+ PATTERN OPTIONS) --------------------------------------
    let sliderRowsWrap = section("Shape", { details: true });

    const sliderRefs = {};
    function row(key, label, min, max, step) {
      const rowEl = document.createElement("div");
      rowEl.className = "param-row";
      const lab = document.createElement("label");
      lab.textContent = label;
      const input = document.createElement("input");
      input.type = "range";
      input.min = min; input.max = max; input.step = step;
      input.value = state[key];
      const valSpan = document.createElement("span");
      valSpan.className = "param-value";
      valSpan.textContent = state[key];
      input.addEventListener("input", () => {
        state[key] = parseFloat(input.value);
        valSpan.textContent = state[key];
        regenerate();
      });
      rowEl.appendChild(lab); rowEl.appendChild(input); rowEl.appendChild(valSpan);
      sliderRowsWrap.appendChild(rowEl);
      sliderRefs[key] = { input, valSpan };
      return rowEl;
    }

    const scaleRow = row("scale", "Scale", 8, 160, 2);
    const octaveRow = row("octaves", "Octaves", 1, 6, 1);
    const countRow = row("count", "Count", 2, 80, 1);

    const patternOptionsLabel = document.createElement("div");
    patternOptionsLabel.className = "pattern-group-label";
    patternOptionsLabel.textContent = "Pattern Options";
    sliderRowsWrap.appendChild(patternOptionsLabel);

    // Custom control rows (declared per pattern in PATTERN_META[kind].custom):
    // built once at mount into one container per pattern -- shown only while
    // that pattern is selected (toggled in the pattern-button handler, same as
    // scaleRow/octaveRow/countRow) -- and reading/writing
    // state.custom[kind][key], so values persist across pattern switches
    // exactly like the shared sliders do.
    const customRangeRefs = {};
    const customSelectRefs = {};
    function customRangeRow(kind, def) {
      const rowEl = document.createElement("div");
      rowEl.className = "param-row";
      const lab = document.createElement("label");
      lab.textContent = def.label;
      const input = document.createElement("input");
      input.type = "range";
      input.min = def.min; input.max = def.max; input.step = def.step;
      input.value = state.custom[kind][def.key];
      const valSpan = document.createElement("span");
      valSpan.className = "param-value";
      valSpan.textContent = state.custom[kind][def.key];
      input.addEventListener("input", () => {
        state.custom[kind][def.key] = parseFloat(input.value);
        valSpan.textContent = state.custom[kind][def.key];
        regenerate();
      });
      rowEl.appendChild(lab); rowEl.appendChild(input); rowEl.appendChild(valSpan);
      (customRangeRefs[kind] = customRangeRefs[kind] || {})[def.key] = { input, valSpan };
      return rowEl;
    }
    function customSelectRow(kind, def) {
      const rowEl = document.createElement("div");
      rowEl.className = "param-row";
      const lab = document.createElement("label");
      lab.textContent = def.label;
      rowEl.appendChild(lab);
      const group = document.createElement("div");
      group.className = "pattern-select";
      const btns = [];
      def.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "btn" + (state.custom[kind][def.key] === opt.value ? " primary" : "");
        btn.textContent = opt.label;
        btn.addEventListener("click", () => {
          state.custom[kind][def.key] = opt.value;
          btns.forEach(b => b.classList.remove("primary"));
          btn.classList.add("primary");
          regenerate();
        });
        btns.push(btn);
        group.appendChild(btn);
      });
      rowEl.appendChild(group);
      (customSelectRefs[kind] = customSelectRefs[kind] || {})[def.key] = { btns, def };
      return rowEl;
    }
    // display:contents so the rows inside participate directly in the
    // .texture-sliders flex flow, identical to the shared slider rows.
    const customWraps = {};
    Object.keys(PATTERN_META).forEach(kind => {
      const defs = PATTERN_META[kind].custom;
      if (!defs || !defs.length) return;
      const wrap = document.createElement("div");
      wrap.style.display = kind === state.pattern ? "contents" : "none";
      defs.forEach(def => {
        wrap.appendChild(def.type === "select" ? customSelectRow(kind, def) : customRangeRow(kind, def));
      });
      sliderRowsWrap.appendChild(wrap);
      customWraps[kind] = wrap;
    });
    countRow.style.display = "none";

    // --- 4. SURFACE & TONE (<details open> — expanded by default, nothing
    // hidden, just collapsible for a shorter panel) ------------------------
    sliderRowsWrap = section("Surface & Tone", { details: true });
    row("roughness", "Roughness", 0.1, 0.9, 0.05);
    row("contrast", "Contrast", 0.5, 3, 0.05);

    const levelsLabel = document.createElement("div");
    levelsLabel.className = "pattern-group-label";
    levelsLabel.textContent = "Levels";
    sliderRowsWrap.appendChild(levelsLabel);
    row("levelsBlack", "Black Point", 0, 0.9, 0.01);
    row("levelsWhite", "White Point", 0.1, 1, 0.01);
    row("levelsGamma", "Gamma", 0.2, 3, 0.05);

    const invertRow = document.createElement("div");
    invertRow.className = "param-row";
    const invertLabel = document.createElement("label");
    invertLabel.textContent = "Invert";
    const invertInput = document.createElement("input");
    invertInput.type = "checkbox";
    invertInput.checked = state.invert;
    invertInput.addEventListener("change", () => {
      state.invert = invertInput.checked;
      regenerate();
    });
    invertRow.appendChild(invertLabel);
    invertRow.appendChild(invertInput);
    sliderRowsWrap.appendChild(invertRow);

    // --- 5. PREVIEW & ANIMATION ---------------------------------------------
    // Bump Strength / Light Angle drive the Bump Preview + Normal export
    // lighting (not the height data itself), so they're grouped here with
    // Animate / Tile Preview — the animate row (built further down, once the
    // preview canvases exist) is appended into this same section body.
    const previewAnimBody = section("Preview & Animation", { details: true });
    sliderRowsWrap = previewAnimBody;
    row("bumpStrength", "Bump Strength", 0.1, 3, 0.05);
    row("lightAngle", "Light Angle", 0, 360, 5);

    const allPatternBtns = [];
    const patternBtnByKind = {};
    // Shared resync used both by the pattern-button click handler and by
    // preset loading (backlog #3) — whichever changes state.pattern must run
    // the same active-button / row-visibility / custom-wrap sync so the UI
    // never silently drifts from state.
    function syncPatternUI(kind) {
      const meta = PATTERN_META[kind];
      allPatternBtns.forEach(b => b.classList.remove("primary"));
      if (patternBtnByKind[kind]) patternBtnByKind[kind].classList.add("primary");
      scaleRow.style.display = meta.params.scale ? "flex" : "none";
      octaveRow.style.display = meta.params.octaves ? "flex" : "none";
      countRow.style.display = meta.params.count ? "flex" : "none";
      Object.keys(customWraps).forEach(k => {
        customWraps[k].style.display = k === kind ? "contents" : "none";
      });
    }
    PATTERN_GROUPS.forEach(group => {
      const groupWrap = document.createElement("div");
      groupWrap.className = "pattern-group";
      const groupLabel = document.createElement("div");
      groupLabel.className = "pattern-group-label";
      groupLabel.textContent = group.label;
      groupWrap.appendChild(groupLabel);
      const groupBtns = document.createElement("div");
      groupBtns.className = "pattern-select";
      group.kinds.forEach(kind => {
        const meta = PATTERN_META[kind];
        const btn = document.createElement("button");
        btn.className = "btn pattern-btn" + (state.pattern === kind ? " primary" : "");
        btn.innerHTML = '<span class="ic" aria-hidden="true">' + (PATTERN_ICONS[kind] || "") + "</span><span>" + meta.name + "</span>";
        btn.addEventListener("click", () => {
          state.pattern = kind;
          syncPatternUI(kind);
          regenerate();
        });
        allPatternBtns.push(btn);
        patternBtnByKind[kind] = btn;
        groupBtns.appendChild(btn);
      });
      groupWrap.appendChild(groupBtns);
      groupWrapByLabel[group.label] = groupWrap;
      patternGroup.appendChild(groupWrap);
    });
    applyPatternFilter("all");

    // Full "surprise me" for the top quick-start Randomize: roll the shape /
    // surface sliders (keeping Levels, which clip if inverted), the current
    // pattern's own options, invert, and a fresh seed. Pattern choice is kept —
    // it's the equivalent of the "generator" in the other tools.
    function randomizeAll() {
      const skip = { levelsBlack: 1, levelsWhite: 1, levelsGamma: 1 };
      function rollInput(inp) {
        const min = parseFloat(inp.min), max = parseFloat(inp.max), step = parseFloat(inp.step) || 1;
        let n = min + Math.random() * (max - min);
        n = Math.round(n / step) * step;
        return Math.min(max, Math.max(min, parseFloat(n.toFixed(4))));
      }
      Object.keys(sliderRefs).forEach(key => {
        if (skip[key]) return;
        const ref = sliderRefs[key];
        ref.input.value = rollInput(ref.input);
        state[key] = parseFloat(ref.input.value);
        ref.valSpan.textContent = state[key];
      });
      state.invert = Math.random() < 0.5;
      invertInput.checked = state.invert;
      const pk = state.pattern;
      const cr = customRangeRefs[pk];
      if (cr) Object.keys(cr).forEach(key => {
        const ref = cr[key];
        ref.input.value = rollInput(ref.input);
        state.custom[pk][key] = parseFloat(ref.input.value);
        ref.valSpan.textContent = state.custom[pk][key];
      });
      const cs = customSelectRefs[pk];
      if (cs) Object.keys(cs).forEach(key => {
        const ref = cs[key];
        const opt = ref.def.options[Math.floor(Math.random() * ref.def.options.length)];
        state.custom[pk][key] = opt.value;
        ref.btns.forEach(b => b.classList.toggle("primary", b.textContent === opt.label));
      });
      state.seed = Math.floor(Math.random() * 1e9);
      seedValue.textContent = String(state.seed);
      regenerate();
    }

    // --- Preset library wiring (backlog #3) --------------------------------
    // Storage: window.storage (used by the Overlay Customizer's palette
    // save/load, see buildPalettePanel above) is an environment-injected API
    // that is never defined anywhere in this file — it's only present in
    // whatever sandboxed host provides it, and silently falls through to
    // "Storage unavailable" otherwise. This app is also opened as a plain
    // local file and served static on GitHub Pages (see root CLAUDE.md), both
    // plain-browser contexts with no such global. Presets use `localStorage`
    // directly instead, under the same key-naming scheme the spec specifies
    // (`texturepreset:<name>`, `texturepreset:index`) so the feature actually
    // persists in every context this app runs in.
    function presetStorageGet(key) {
      try { return localStorage.getItem(key); } catch (e) { return null; }
    }
    function presetStorageSet(key, value) {
      try { localStorage.setItem(key, value); return true; } catch (e) { return false; }
    }
    function loadPresetIndex() {
      try {
        const arr = JSON.parse(presetStorageGet("texturepreset:index") || "[]");
        return Array.isArray(arr) ? arr : [];
      } catch (e) { return []; }
    }
    function savePresetIndex(names) {
      presetStorageSet("texturepreset:index", JSON.stringify(names));
    }
    function getPresetByName(name) {
      if (BUILTIN_PRESETS[name]) return BUILTIN_PRESETS[name];
      try {
        const raw = presetStorageGet("texturepreset:" + name);
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    }
    // Saves the *look*, not the session: everything in `state` except `seed`
    // (explicit in the spec — a preset should look like itself on any seed)
    // and also except `time`/`animate` (a judgment call beyond the spec: those
    // are transient playback state, not parameters of the look, and blindly
    // restoring `animate` would desync the Play/Pause button and rAF loop
    // from state.animate since those are only ever meant to change together
    // via setAnimate()). Name collisions with a built-in are rejected outright
    // rather than silently overwritten or renamed, so the shipped reference
    // presets always stay exactly what's documented in CHANGELOG.md.
    function savePresetAs(name) {
      name = (name || "").trim();
      if (!name) return { ok: false, reason: "empty" };
      if (BUILTIN_PRESETS[name]) return { ok: false, reason: "builtin-collision" };
      const toSave = {
        pattern: state.pattern, scale: state.scale, octaves: state.octaves, count: state.count,
        roughness: state.roughness, contrast: state.contrast, levelsBlack: state.levelsBlack,
        levelsWhite: state.levelsWhite, levelsGamma: state.levelsGamma,
        bumpStrength: state.bumpStrength, lightAngle: state.lightAngle, invert: state.invert,
        custom: JSON.parse(JSON.stringify(state.custom))
      };
      presetStorageSet("texturepreset:" + name, JSON.stringify(toSave));
      const idx = loadPresetIndex();
      if (!idx.includes(name)) { idx.push(name); savePresetIndex(idx); }
      refreshPresetDropdown();
      return { ok: true };
    }
    function syncSharedSlidersUI() {
      Object.keys(sliderRefs).forEach(key => {
        const { input, valSpan } = sliderRefs[key];
        input.value = state[key];
        valSpan.textContent = state[key];
      });
    }
    function syncCustomControlsUI() {
      Object.keys(customRangeRefs).forEach(kind => {
        Object.keys(customRangeRefs[kind]).forEach(key => {
          const { input, valSpan } = customRangeRefs[kind][key];
          const v = state.custom[kind][key];
          input.value = v;
          valSpan.textContent = v;
        });
      });
      Object.keys(customSelectRefs).forEach(kind => {
        Object.keys(customSelectRefs[kind]).forEach(key => {
          const { btns, def } = customSelectRefs[kind][key];
          const v = state.custom[kind][key];
          btns.forEach(b => b.classList.remove("primary"));
          const idx = def.options.findIndex(o => o.value === v);
          if (idx >= 0) btns[idx].classList.add("primary");
        });
      });
    }
    // Applies every field of a saved/built-in preset object to `state`
    // (leaving state.seed untouched) and resyncs every control that could be
    // showing a now-stale value: shared sliders, custom-param rows for every
    // pattern kind, the Invert checkbox, and the pattern-button/row-visibility
    // resync shared with the pattern-button click handler.
    function applyPresetState(preset) {
      state.pattern = preset.pattern;
      state.scale = preset.scale;
      state.octaves = preset.octaves;
      state.count = preset.count;
      state.roughness = preset.roughness;
      state.contrast = preset.contrast;
      state.levelsBlack = preset.levelsBlack;
      state.levelsWhite = preset.levelsWhite;
      state.levelsGamma = preset.levelsGamma;
      state.bumpStrength = preset.bumpStrength;
      state.lightAngle = preset.lightAngle;
      state.invert = preset.invert;
      state.custom = JSON.parse(JSON.stringify(preset.custom || {}));
      // Defensive: fill in any pattern kind the saved preset predates (e.g. a
      // preset saved before a new Pro Finish pattern shipped custom params).
      Object.keys(PATTERN_META).forEach(kind => {
        if (!state.custom[kind]) {
          state.custom[kind] = {};
          (PATTERN_META[kind].custom || []).forEach(def => { state.custom[kind][def.key] = def.default; });
        }
      });
      invertInput.checked = state.invert;
      syncSharedSlidersUI();
      syncCustomControlsUI();
      syncPatternUI(state.pattern);
      regenerate();
    }
    function refreshPresetDropdown() {
      const savedNames = loadPresetIndex().filter(n => !BUILTIN_PRESETS[n]);
      const allNames = Object.keys(BUILTIN_PRESETS).concat(savedNames);
      const prevValue = presetSelect.value;
      presetSelect.innerHTML = "";
      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = "Load preset…";
      presetSelect.appendChild(placeholder);
      allNames.forEach(name => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name + (BUILTIN_PRESETS[name] ? " ★" : "");
        presetSelect.appendChild(opt);
      });
      presetSelect.value = allNames.includes(prevValue) ? prevValue : "";
    }
    presetSelect.addEventListener("change", () => {
      const name = presetSelect.value;
      presetSelect.value = "";
      if (!name) return;
      const preset = getPresetByName(name);
      if (preset) applyPresetState(preset);
    });
    savePresetBtn.addEventListener("click", () => {
      const name = window.prompt("Save current settings as preset:", "");
      if (name == null) return;
      const result = savePresetAs(name);
      if (result.ok) {
        presetStatus.textContent = "Saved “" + name.trim() + "”";
      } else if (result.reason === "builtin-collision") {
        presetStatus.textContent = "Name reserved by a built-in — pick another";
      } else {
        presetStatus.textContent = "";
      }
      setTimeout(() => presetStatus.textContent = "", 3000);
    });
    refreshPresetDropdown();

    seedValue.textContent = String(state.seed);

    const canvasRow = document.createElement("div");
    canvasRow.className = "canvas-row";
    main.appendChild(canvasRow);

    function canvasPanel(title, caption) {
      const panel = document.createElement("div");
      panel.className = "canvas-panel";
      const h3 = document.createElement("div");
      h3.className = "canvas-panel-title";
      h3.textContent = title;
      const canvas = document.createElement("canvas");
      panel.appendChild(h3);
      panel.appendChild(canvas);
      if (caption) {
        const cap = document.createElement("div");
        cap.className = "preview-caption";
        cap.textContent = caption;
        panel.appendChild(cap);
      }
      canvasRow.appendChild(panel);
      return canvas;
    }

    const textureCanvas = canvasPanel("Texture / Height Map", "This is the exportable data.");
    const bumpCanvas = canvasPanel("Bump Preview (simulated light)", "Lighting preview only — not exported as a texture. Adjust Bump Strength / Light Angle above.");

    // --- 7. EXPORT: Group A "Static maps" (always visible) + Group B
    // "Animated" (<details open> — expanded by default, nothing hidden).
    const exportSection = document.createElement("div");
    exportSection.className = "export-section";
    const exportLabel = document.createElement("div");
    exportLabel.className = "section-label";
    exportLabel.textContent = "Export";
    exportSection.appendChild(exportLabel);

    const staticGroupLabel = document.createElement("div");
    staticGroupLabel.className = "pattern-group-label";
    staticGroupLabel.textContent = "Static maps";
    exportSection.appendChild(staticGroupLabel);
    const actions = document.createElement("div");
    actions.className = "cell-actions";
    exportSection.appendChild(actions);

    const animDetails = document.createElement("details");
    animDetails.className = "export-section";

    async function exportFrameSequence(frameCount) {
      const wasAnimating = animate;
      if (wasAnimating) setAnimate(false);
      const savedTime = state.time;
      const savedAnimate = state.animate;
      state.animate = true;
      exportFramesBtn.disabled = true;
      frameCountSelect.disabled = true;
      const seedTag = state.pattern + "_" + state.seed;
      const frames = [];
      try {
        const exportCanvas = document.createElement("canvas");
        for (let k = 0; k < frameCount; k++) {
          state.time = k / frameCount;
          const data = computeTextureData(TEXTURE_EXPORT_SIZE, state);
          paintHeightMap(exportCanvas, data, TEXTURE_EXPORT_SIZE, TEXTURE_EXPORT_SIZE);
          const blob = await new Promise(res => exportCanvas.toBlob(res, "image/png"));
          if (!blob) throw new Error("toBlob failed");
          const url = URL.createObjectURL(blob);
          const filename = seedTag + "_" + String(k + 1).padStart(4, "0") + ".png";
          frames.push({ url, filename });
          statusLine.textContent = "Rendering frame " + (k + 1) + "/" + frameCount + "…";
          await new Promise(r => setTimeout(r, 0));
        }
        openFrameGalleryInNewTab(frames, seedTag);
        statusLine.textContent = "Frame sequence (" + frameCount + ") opened in a new tab — save from there";

        statusLine.textContent = "Frame sequence export failed";
        frames.forEach(f => URL.revokeObjectURL(f.url));
      } finally {
        state.time = savedTime;
        state.animate = savedAnimate;
        regenerate();
        exportFramesBtn.disabled = false;
        frameCountSelect.disabled = false;

    function pickWebMMimeType() {
      const candidates = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
      return candidates.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
    }

    exportWebMBtn.addEventListener("click", exportWebM);

    async function exportWebM() {
      if (!window.MediaRecorder) {
        statusLine.textContent = "WebM export needs MediaRecorder — unavailable in this browser";
        setTimeout(() => statusLine.textContent = "", 3500);
        return;
      }
      exportFramesBtn.disabled = true;
      frameCountSelect.disabled = true;
      exportWebMBtn.disabled = true;
      const seedTag = state.pattern + "_" + state.seed;
      const wasAnimating = animate;
      // state.time is periodic in loopMs regardless of phase, so any loopMs-long
      // capture window loops seamlessly on playback — just make sure it's running.
      if (!wasAnimating) setAnimate(true);
      const mimeType = pickWebMMimeType();
      const stream = textureCanvas.captureStream(30);
      const recorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
      const chunks = [];
      recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      const stopped = new Promise(resolve => { recorder.onstop = resolve; });
      recorder.start();
      statusLine.textContent = "Recording one loop (" + (loopMs / 1000).toFixed(1) + "s)…";
      await new Promise(r => setTimeout(r, loopMs + 60));
      recorder.stop();
      try {
        await stopped;
        const blob = new Blob(chunks, { type: mimeType || "video/webm" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "texture_" + seedTag + ".webm";
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
        statusLine.textContent = "WebM clip downloaded";
      } catch (e) {
        statusLine.textContent = "WebM export failed";
      } finally {
        if (!wasAnimating) setAnimate(false);
        exportFramesBtn.disabled = false;
        frameCountSelect.disabled = false;
        exportWebMBtn.disabled = false;
        setTimeout(() => statusLine.textContent = "", 3500);
      }
    }

    const foot = document.createElement("footer");

      '<li><span class="k">Frame Sequence</span> the animated height map across one loop as numbered PNGs (new tab). For an animated bump channel.</li>' +
      '<li><span class="k">WebM</span> the same animated loop as one single-file video clip — convenient to save or share, but lossy-compressed. Use the frame sequence when the receiving pipeline wants precise per-frame texture data.</li>' +

    // --- Tile Preview (display-only QA view, feature backlog #1): when on,
    // both preview panels show the already-computed map repeated 3x3 at 1/3
    // scale so spatial seams become visible on every pattern — including the
    // ones documented as non-tiling. It lives outside `state` and never
    // touches computeTextureData or any export path: exports always produce
    // the single un-tiled map. ---
    let tilePreview = false;
    const tileScratchTex = document.createElement("canvas");
    const tileScratchBump = document.createElement("canvas");
    function drawTiled3x3(dst, src, size) {
      dst.width = size; dst.height = size;
      const ctx = dst.getContext("2d");
      const third = size / 3;
      for (let ty = 0; ty < 3; ty++) {
        for (let tx = 0; tx < 3; tx++) ctx.drawImage(src, tx * third, ty * third, third, third);
      }
    }

    function regenerate() {
      const data = computeTextureData(TEXTURE_PREVIEW_SIZE, state);
      // With Tile Preview on, paint into offscreen scratch canvases and
      // drawImage them 3x3 into the visible panels — the map is never
      // regenerated at a different size. Runs per rAF frame while animating,
      // so each fresh animated frame is tiled too.
      const texTarget = tilePreview ? tileScratchTex : textureCanvas;
      const bumpTarget = tilePreview ? tileScratchBump : bumpCanvas;
      paintHeightMap(texTarget, data, TEXTURE_PREVIEW_SIZE, TEXTURE_PREVIEW_SIZE);
      paintBumpPreview(bumpTarget, data, TEXTURE_PREVIEW_SIZE, TEXTURE_PREVIEW_SIZE, state.bumpStrength, state.lightAngle);
      if (tilePreview) {
        drawTiled3x3(textureCanvas, tileScratchTex, TEXTURE_PREVIEW_SIZE);
        drawTiled3x3(bumpCanvas, tileScratchBump, TEXTURE_PREVIEW_SIZE);
      }
    }

    // --- Animation: live rAF preview (§6.2). Static export is unchanged; this
    // only drives the on-screen preview. state.time cycles 0..1 per loop. ---
    let animate = false, rafId = null, loopMs = 3000;
    const animRow = document.createElement("div");
    animRow.className = "param-row";
    animRow.style.display = "flex";
    animRow.style.alignItems = "center";
    animRow.style.gap = "12px";
